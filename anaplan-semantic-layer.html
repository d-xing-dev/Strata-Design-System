   ${grp(`<div class="st-helper">The words this client uses. Answers come back in these, not ours
      &mdash; and a term the agent used can be traced back to its entry here.</div>`,
    `<div class="st-table-wrap"><table class="st-table"><thead><tr>
      ${sortHead('Term','ascending')}${sortHead('Means')}${sortHead('Provenance')}</tr></thead>
     <tbody>
      <tr class="st-table__rowlink"><td class="st-nowrap"><a href="#model-home">Colleague</a></td>
       <td>Any employee, permanent or fixed-term. Excludes contractors.</td>
       <td>${tag('agreed')}</td></tr>
      <tr class="st-table__rowlink"><td class="st-nowrap"><a href="#model-home">Uplift</a></td>
       <td>The annual pay award, applied in April.</td><td>${tag('machine draft')}</td></tr>
     </tbody></table></div>`)}</div>`;
}

V['model-home'] = () => pageP('Workforce planning for Meridian Retail', null,
  R('model-home.honesty-snapshot', stateIf('model-home.honesty-snapshot', honesty(0)))
  + R('model-home.needs-me',    stateIf('model-home.needs-me', needsMe(0)))
  + R('model-home.gaps-block',  stateIf('model-home.gaps-block', gapsBlock(2)))
  + R('model-home.area-list',   stateIf('model-home.area-list', areaList(0)))
  + R('model-home.area-editor', stateIf('model-home.area-editor', areaEditor(1)))
  + R('model-home.glossary',    stateIf('model-home.glossary', glossary(0)))
);

/* ============================================================
   Needs you — every band, and the reveal pane.
   Regions: run-status, run-summary, position-remaining, zero-state,
   band-zone3 / zone2-t2 / zone2-t1 / onboarding / suspect / orphaned,
   item-detail.
   ============================================================ */
const BANDS = {
 zone3:{code:'queue.band-zone3', shape:'table',
   cols:['Element','What changed','Why it is here','Proposed'],
   note:'Ordered so invalidated agreed content comes first, then by how central the element is.'},
 rewritten:{code:'queue.band-zone2-t2', shape:'table',
   cols:['Element','What changed','State','Revert'],
   note:'Each one is revertible and the revert is prominent. <b>Bulk actions are absent here, and that absence is the rule</b> — a rewrite is a claim about meaning, and meaning is never accepted in bulk.'},
 renames:{code:'queue.band-zone2-t1', shape:'table', bulk:true,
   cols:['Element','Was','Now','Provenance'],
   note:'Mechanical, so these <b>can</b> be acknowledged in bulk. Provenance is deliberately unchanged by a rename.'},
 onboarding:{code:'queue.band-onboarding', shape:'table',
   cols:['Element','Source','Confidence','Provenance'],
   note:'First-time descriptions from the initial read. Unverified first.'},
 doubt:{code:'queue.band-suspect', shape:'cards',
   note:'The anchor changed underneath and the wording may no longer be true. Each is a separate errand.'},
 orphan:{code:'queue.band-orphaned', shape:'cards',
   note:'The element is gone from Anaplan and the note about it survived. Nothing is deleted silently.'},
};

const CHIP = {'was agreed':'amber','new':'blue','central':'red','applied':'teal','revert':'',
  'unchanged':'','high':'green','low':'amber','draft ready':'blue'};
function chip(v) {
  if (!v || v === '—') return '<span class="st-text-secondary">—</span>';
  const h = CHIP[v]; return `<span class="st-tag st-tag--sm${h ? ' st-tag--' + h : ''}">${E(v)}</span>`;
}

/* Every band carries an empty, and every empty says something different —
   an empty band means a different thing in each case, and "no results" would
   erase the difference. */
function bandEmpty(key) {
  const [t, body] = EMPTY[key] || EMPTY.zone3;
  return `<div class="st-empty"><p class="st-empty__title">${t}</p>
    <p class="st-empty__body">${body}</p></div>`;
}

/* Rows carry short comparable values. Anything that is a sentence belongs in the
   panel — a table cell holding prose is a paragraph in a grid, and it stops the
   column being scannable, which is the only reason to use a table at all. */
function bandTable(b, rows, c, st) {
  st = st || {};
  const sel = st.selection ? [0, 1] : S.sel;
  const bulk = b.bulk ? `<div class="st-row st-row--between">
     <span class="st-helper">${sel.length
       ? `<b>${sel.length}</b> selected &mdash; per-row actions are disabled while a selection is active`
       : 'Select rows to acknowledge several at once'}</span>
     <div class="st-btn-group"><button class="st-btn st-btn--secondary st-btn--sm"${sel.length ? '' : ' disabled'}>Acknowledge ${sel.length || ''}</button></div>
    </div>` : '';
  return grp(bulk, `<div class="st-table-wrap"><table class="st-table">
    <thead><tr>${b.bulk ? '<th scope="col" style="width:44px"><span class="st-visually-hidden">Select</span></th>' : ''}
      ${b.cols.map((x, k) => sortHead(x, k === 0 ? 'ascending' : null)).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="st-table__rowlink"${S.panel === i ? ' aria-selected="true"' : ''} data-panel="${i}">
      ${b.bulk ? `<td data-stop><label><input type="checkbox" class="st-check" ${sel.includes(i) ? 'checked' : ''} data-sel="${i}" aria-label="Select ${E(r[0])}"><span class="st-check__box"></span></label></td>` : ''}
      <td class="st-nowrap"><a class="st-code" href="#queue" data-panel="${i}">${E(r[0])}</a></td>
      <td class="st-nowrap">${E(r[1])}</td>
      <td>${chip(r[2])}</td>
      <td class="st-nowrap">${r[3] === '—' ? '<span class="st-text-secondary">—</span>' : chip(r[3])}</td>
      </tr>`).join('')}
    </tbody></table></div>`,
   `<div class="st-helper">${st.note || b.note}</div>`,
   `<div class="st-helper"><b>${N(c[2] - rows.length)}</b> more in this category &middot;
     <b>${N(755 - c[2])}</b> waiting in the others, all still counted beside you.</div>`);
}

function bandCards(b, rows, c, st) {
  st = st || {};
  return grp(`<div class="st-stack" style="--gap:var(--st-space-04)">
    ${rows.map((r, i) => `<div class="st-tile st-tile--clickable${S.panel === i ? ' st-tile--selected' : ''}" data-panel="${i}">
      <div class="st-tile__title"><span class="st-code">${E(r[0])}</span></div>
      <div class="st-tile__body"><p class="st-body-sm">${E(r[1])}</p>
       <div class="st-btn-group"><button class="st-btn st-btn--secondary st-btn--sm" data-panel="${i}">Look at it</button></div></div></div>`).join('')}
   </div>`,
   `<div class="st-helper">${st.note || b.note}
    Each is a separate errand, so these are cards rather than rows — there is nothing to compare across.
    <b>${N(c[2] - rows.length)}</b> more.</div>`);
}

/* queue.item-detail — the reveal pane. Seven states in the spec; three drawn,
   the rest reachable from the review drawer. */
function itemDetail(c, r) {
  if (!r) return null;
  const k = (stateOf('queue.item-detail') || {kind:'question'}).kind;
  const done = {accepted:['Accepted','It is agreed now, and it says who agreed it and when. That is what makes it citable.'],
                notneeded:['Recorded as not needed','The flag stops. <b>It stays disclosable</b> — an answer that touches this still says nobody described it, because that is true.'],
                left:['Left alone','It stays undescribed, so <b>it comes back</b> on the next run. Leaving something is a decision the product remembers, not one it forgets.']}[k];

  const body = done
    ? `<div class="st-note st-note--success"><div><b>${done[0]}.</b> ${done[1]}</div></div>
       <div class="st-btn-group"><button class="st-btn st-btn--tertiary st-btn--sm">Undo</button></div>`
    : k === 'rewrite'
    ? grp(`<div class="st-heading-sm">The machine rewrote this</div>`,
        `<div><div class="st-codeblock__head">Before</div>
          <pre class="st-codeblock st-codeblock--line">Headcount in FTE, as at month end.</pre></div>`,
        `<div><div class="st-codeblock__head">After</div>
          <pre class="st-codeblock st-codeblock--line">Headcount FTE, as at month end.</pre></div>`,
        `<div class="st-helper">Only the substituted name changed. <b>Revert restores the earlier
          version rather than deleting this one</b>, and both stay in the history.</div>`,
        `<div class="st-btn-group"><button class="st-btn st-btn--secondary st-btn--sm">Revert</button>
          <button class="st-btn st-btn--tertiary st-btn--sm">Keep it</button></div>`)
    : k === 'rename'
    ? grp(`<div class="st-heading-sm">A rename, and nothing else</div>`,
        `<dl class="st-kv"><dt>Was</dt><dd><span class="st-code">FTE</span></dd>
          <dt>Now</dt><dd><span class="st-code">Headcount FTE</span></dd>
          <dt>Provenance</dt><dd>unchanged &mdash; still agreed by A. Rahman, 26 Jul</dd></dl>`,
        `<div class="st-helper">The element is the same element. <b>Provenance is deliberately
          unchanged by a rename</b>: a new label is not a new agreement.</div>`,
        `<div class="st-btn-group"><button class="st-btn st-btn--primary st-btn--sm" data-answer>Acknowledge</button></div>`)
    : grp(`<div class="st-heading-sm">${E(r[4] || 'What we need')}</div>`,
        `<div class="st-body-sm">${E(r[5] || '')}</div>`) +
      `<dl class="st-kv"><dt>What changed</dt><dd>${E(r[1])}</dd>
        <dt>Why it is here</dt><dd>${chip(r[2])}</dd>
        <dt>Centrality</dt><dd>Feeds 3 &middot; fed by 2</dd></dl>` +
      grp(`<div class="st-label st-text-secondary">The description as it stands today</div>`,
        `<div class="st-body-sm">Uplift applied to base salary before the monthly aggregation.
          Agreed by A. Rahman, 26 Jul.</div>`,
        `<div class="st-helper">The full current text is always shown before anything is confirmed
          &mdash; you never agree to something you have not read.</div>`) +
      (r[3] === 'draft ready' ? `<div class="st-note"><div>
        <b>A machine draft is ready.</b> "Uplift now applies inside the bracket, so it compounds with
        the grade rate." Accept it or write over it &mdash; it is a starting point, not an answer.</div></div>` : '') +
      (k === 'blocked' ? `<div class="st-note st-note--error"><div>
        <b>Confirm is blocked.</b> The text on this screen is not the current text &mdash; somebody
        saved while you were reading. Reload the item to see what it says now.</div></div>` : '') +
      `<div class="st-btn-group">
        <button class="st-btn st-btn--primary st-btn--sm"${k === 'blocked' ? ' disabled' : ''} data-answer>Confirm</button>
        <button class="st-btn st-btn--secondary st-btn--sm"${k === 'blocked' ? ' disabled' : ''}>Write my own</button>
        <button class="st-btn st-btn--tertiary st-btn--sm">Not needed</button>
        <button class="st-btn st-btn--tertiary st-btn--sm">Leave it</button></div>` +
      `<div class="st-helper">"Not needed" is recorded and stops the flag; it stays disclosable in an
        answer. "Leave it" means it stays undescribed, so it comes back.</div>`;

  return panel(r[0], E(c[1]) + ' &middot; raised by the run on 2 August', body
    + `<div><a class="st-link" href="#workbench" data-go="workbench" data-mod="SAL03">Open this element fully</a></div>`,
    'queue.item-detail');
}

V.queue = () => {
  const c = CATS.find(x => x[0] === S.cat) || CATS[0];
  const b = BANDS[c[0]] || BANDS.zone3;
  const bandSt = stateOf(b.code) || {rows:'all'};
  let rows = QITEMS[c[0]] || [];
  if (bandSt.empty) rows = [];
  else if (bandSt.rows === 'proposed')   rows = rows.filter(r => r[3] === 'draft ready');
  else if (bandSt.rows === 'noproposal') rows = rows.filter(r => r[3] !== 'draft ready');
  else if (bandSt.rows === 'overflow')   rows = rows.slice(0, 2);
  const zero = S.force === 'queue-zero';

  const main =
    grp(R('queue.run-status', `<div class="st-helper">${stateOf('queue.run-status')}</div>`),
      /* G-2 · "may I stop" must be PRESENT, not dominant. The count stays at body
         scale with its meter — a figure at display scale outranks any collection
         beneath it, whatever the reading order says. */
      R('queue.position-remaining', (() => {
        const [line, pct, note] = stateOf('queue.position-remaining', c);
        return `<div class="st-tile"><div class="st-tile__body">
         <div class="st-row st-row--between"><div class="st-body-md">${line}</div>
          <div class="st-helper">every other category still counted beside you</div></div>
         <div class="st-meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"
              aria-label="Answered so far"><i style="width:${pct}%"></i></div>
         <div class="st-helper">${note}</div></div></div>`; })()))
  + (zero
      ? R('queue.zero-state', (() => { const [t, bd] = stateOf('queue.zero-state');
          return `<div class="st-empty"><p class="st-empty__title">${t}</p>
           <p class="st-empty__body">${bd}</p>
           <button class="st-btn st-btn--tertiary st-btn--sm" data-force="">Show the run that did find changes</button></div>`; })())
      : R(b.code, rows.length === 0 ? bandEmpty(bandSt.empty || c[0])
          : b.shape === 'table' ? bandTable(b, rows, c, bandSt) : bandCards(b, rows, c, bandSt))
    )
  + R('queue.run-summary', `<div class="st-tile"><div class="st-tile__body">
       <div class="st-body-sm">${stateOf('queue.run-summary')}
        <a href="#activity" data-go="activity">See the run in the trail</a></div></div></div>`);

  return page(E(c[1]), E(c[3]),
    withPane(main, S.panel != null && !zero ? itemDetail(c, rows[S.panel]) : null),
    crumb([['Needs you','queue'], [c[1],'queue']]));
};

/* The adopted component's chevron. One glyph, defined once. */
const CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';

/* ============================================================
   Explore.

   THE RULE, revised 23 Aug:

     Does clicking it change WHAT YOU ARE LOOKING AT, or reveal more about
     what you are already looking at?

       changes the subject  ->  the centre, and the rail and crumb follow
       reveals more         ->  the side panel

   So a line item takes the middle: it is a thing in the model you go on to
   work on, and it carries enough — formula, grain, meaning, provenance,
   history, two directions of dependency — to fill it. Its walk and its agent
   payload open the panel, because those are facts ABOUT the line item, and
   each is substantial enough to want the room.

   A queue item still opens the panel, and that is consistent rather than an
   exception: you are working the queue, and the item is a detail of it.
   ============================================================ */
function trust(kind, line, why) {
  const cls = {green:'st-note--success', blue:'', teal:'', amber:'st-note--warning', red:'st-note--error'}[kind] || '';
  return `<div class="st-note ${cls}"><div><b>${line}</b>${why ? ` ${why}` : ''}</div></div>`;
}

function structure(o) {
  const formula = o.noformula ? '<span class="st-text-secondary">None. <b>Absent means none</b>, never unknown.</span>'
    : `<pre class="st-codeblock st-codeblock--line">Base Salary Cost * (1 + Uplift %)</pre>`;
  return `<div class="st-tile">${o.dep ? `<div class="st-tile__title">
      <span class="st-fill">SAL03 Salary Cost LC</span>
      <span class="st-tag st-tag--sm st-tag--red">deprecated in Anaplan</span></div>` : ''}
    <div class="st-tile__body"><dl class="st-kv">
     <dt>Formula</dt><dd>${formula}</dd>
     <dt>Class</dt><dd>calculation</dd>
     <dt>Grain</dt><dd>${o.trunc
       ? `Employee &times; Month &times; Legal Entity
          <div class="st-helper"><b>Truncated upstream.</b> One list in this grain has 68,402 members
           and was read in part. The gap is stated in every answer that touches it &mdash; it is
           never silently completed.</div>`
       : 'Employee &times; Month &times; Legal Entity'}</dd>
     <dt>Cells</dt><dd class="st-num">4,118,400</dd></dl>
    ${o.locked ? `<div class="st-helper" style="margin-top:var(--st-space-04)">
      <b>Every field above is locked.</b> They are what Anaplan holds, read and never written, and
      there is no control here that could change one &mdash; the absence of an edit affordance is
      the statement.</div>` : ''}
    ${o.formula ? `<div class="st-helper" style="margin-top:var(--st-space-04)">
      <b>Two dependencies were read out of that formula</b> rather than out of Anaplan's dependency
      list: <span class="st-code">Base Salary Cost</span> and <span class="st-code">Uplift %</span>.
      A parsed edge is a reading of text and is marked as one wherever it appears.</div>` : ''}
    ${o.dep ? `<div class="st-note st-note--error" style="margin-top:var(--st-space-05)"><div>
      <b>Anaplan marks this deprecated.</b> It is still read and still answers, because 141 things
      still depend on it. Deprecated is a statement of intent, not of disconnection.</div></div>` : ''}
    </div></div>`;
}

function meaning(o) {
  const val = o.empty ? '' : o.long
    ? 'Converts salary to local currency before the monthly aggregation, using the monthly rate held in CST02 rather than a spot rate, so that the reported figure matches what finance publishes for the same month and does not move when the rate moves intra-month.'
    : 'Converts salary to local currency before the monthly aggregation.';
  return `<div class="st-formitem st-formitem--full">
     <label class="st-lbl" for="wb-mean">Description</label>
     <textarea class="st-field" id="wb-mean" rows="3"${o.empty ? ' placeholder="Nothing has been written about this yet."' : ''}${
       o.drafting ? ' disabled' : ''}>${o.drafting ? '' : E(val)}</textarea>
     ${o.long ? `<div class="st-helper"><b>Longer than the 240-character nudge.</b> It is not blocked
       and it will not be trimmed &mdash; a nudge that enforces itself is a limit wearing a
       friendly word.</div>` : ''}
     ${o.drafting ? `<div class="st-loading"><span class="st-loading__spinner" aria-hidden="true"></span>
       <span class="st-body-sm">Drafting from the formula and its neighbours &mdash;
        about 900 tokens of your 38,760</span></div>` : ''}
     ${o.failed ? `<div class="st-note st-note--error"><div><b>The draft stopped.</b> It reached the
       monthly budget at 60% through. <b>Nothing partial was saved</b>, because half a description
       reads like a whole one. Raise the budget in Settings or write it yourself.</div></div>` : ''}
     ${o.draft ? `<div class="st-note st-note--warning"><div><b>Machine draft, unconfirmed.</b>
       Confidence 0.71. It is shown because a draft is easier to correct than a blank page, and
       marked because it is not yet evidence of anything.</div></div>` : ''}
    </div>`;
}

function saveRow(k) {
  const M = {
   idle:    ['Nothing to save', false, ''],
   dirty:   ['Unsaved changes', true, ''],
   saving:  ['Saving&hellip;', false, ''],
   saved:   ['Saved 09:41 &middot; verified by a follow-up read', false, ''],
   rejected:['', false, `<div class="st-note st-note--error"><div><b>Anaplan rejected this write.</b>
     A newer version exists &mdash; somebody saved while you were editing. Nothing was merged.
     <a href="#conflict" data-go="conflict">See both versions</a></div></div>`],
   confirm: ['', false, `<div class="st-note st-note--warning"><div><b>Confirm the full text, not the change.</b>
     Agreeing to a diff agrees to a sentence you have not read end to end.
     <pre class="st-codeblock" style="margin-top:var(--st-space-04)">Converts salary to local currency before the
monthly aggregation.</pre></div></div>`]}[k];
  return `${M[2]}<div class="st-btn-group">
    <button class="st-btn st-btn--primary"${M[1] ? '' : ' disabled'}>${k === 'confirm' ? 'Agree to this text' : 'Save'}</button>
    <button class="st-btn st-btn--tertiary"${M[1] || k === 'confirm' ? '' : ' disabled'}>Discard</button>
    ${M[0] ? `<span class="st-helper">${M[0]}</span>` : ''}</div>`;
}

function scopeAck(k) {
  if (k === 'none') return `<div class="st-helper"><b>Model scope.</b> Nothing here crosses into
    another client, so no acknowledgement is needed before saving.</div>`;
  if (k === 'done') return `<div class="st-note st-note--success"><div><b>Acknowledged</b> by d.xing
    at 09:39, and recorded against this description for as long as it exists.</div></div>`;
  return `<div class="st-note st-note--warning"><div>
    <b>This description would cross clients.</b> It names <span class="st-code">Northgate Foods</span>,
    which is a different tenant from the one this model belongs to.
    <label class="st-choice" style="margin-top:var(--st-space-04)">
     <input type="checkbox" class="st-check"${k === 'ticked' ? ' checked' : ''}><span class="st-check__box" aria-hidden="true"></span>
     <span class="st-choice__label">I understand this text will be readable by anyone with access to Meridian Retail</span></label>
    ${k === 'ticked' ? '<div class="st-helper">Ticked, not yet saved. The acknowledgement is stored with the save, not with the tick.</div>' : ''}
    </div></div>`;
}

function agentPreview(o) {
  const head = o.over ? 'Payload &middot; YAML <span class="st-codeblock__meta">71,880 of 64,000 characters</span>'
    : o.restricted ? 'Payload &middot; YAML <span class="st-codeblock__meta">3,004 of 64,000 characters &middot; part withheld</span>'
    : o.live ? 'Payload &middot; YAML <span class="st-codeblock__meta">4,318 of 64,000 characters &middot; updating as you type</span>'
    : 'Payload &middot; YAML <span class="st-codeblock__meta">4,231 of 64,000 characters</span>';
  return grp(
   `<div class="st-helper">Not a summary and not a rendering &mdash; the bytes the agent receives,
     in the order it receives them.</div>`,
   o.over ? `<div class="st-note st-note--warning"><div><b>Over the 64,000-character budget.</b>
     The agent will split this into two passes and say so in the answer. It is not truncated
     &mdash; a silently shortened payload produces a confident answer about half a model.</div></div>` : '',
   `<div><div class="st-codeblock__head">${head}</div>
    <pre class="st-codeblock"><b>id:</b>      SAL03.salary_cost_lc
<b>class:</b>   calculation
<b>formula:</b> Base Salary Cost * (1 + Uplift %)
<b>grain:</b>   [Employee, Month, Legal Entity]
<b>meaning:</b> |
  Converts salary to local currency before the
  monthly aggregation.
<b>agreed:</b>  { by: A. Rahman, on: 2026-07-26 }
<b>feeds:</b>
${o.restricted ? `  <i>withheld: 2 elements outside your scope</i>` : `  - CST02.salary_cost_gbp
  - CST04.on_costs`}</pre></div>`,
   o.restricted ? `<div class="st-note st-note--warning"><div><b>Two references are withheld by a
     scope rule.</b> The agent is told they exist and told it cannot see them, so it can say the
     chain continues rather than answering as though it ends.</div></div>` : '',
   o.live ? `<div class="st-helper">This is recomputing as you type. What you are looking at is what
     would be sent <b>now</b>, not what was sent last time.</div>` : '');
}

function railSearchState(o) {

       placeholder="Find anything" aria-label="Find anything">
     </label><div class="st-search__count${o.many ? ' st-search__count--over' : ''}" aria-live="polite">${count}</div></div>`,
   o.filtered ? `<div class="st-row" style="--gap:var(--st-space-03)">
     <span class="st-tag st-tag--sm st-tag--interactive">undocumented only<button class="st-tag__x" aria-label="Clear undocumented filter">&times;</button></span>
     <span class="st-tag st-tag--sm st-tag--interactive">Salary and cost<button class="st-tag__x" aria-label="Clear area filter">&times;</button></span></div>` : '',

   o.many ? `<div class="st-note st-note--warning"><div><b>Too many to draw.</b> 9,204 results is a

function bulkBar(o) {

   ${o.explain ? `<span class="st-helper" style="max-width:38ch"><b>There is no bulk describe.</b>

/* ---- the module: a list, and clicking a row changes the subject ---- */
function moduleScreen(mod, list) {
  /* The bar exists as a region whether or not anything is selected: state 0 IS
     "hidden until something is selected", and a region that only exists when it
     is visible cannot have that state proven. */
  const bulk = R('workbench.bulk-bar', stateIf('workbench.bulk-bar', S.sel.length ? bulkBar({explain:true}) : ''));
  const main = bulk
    + R('workbench.trust-strip', `<div class="st-note"><div>
        <b>${E(mod[1])}</b> was read on 26 July and agreed by james.t. Two of its line items have
        changed in Anaplan since &mdash; they carry a mark in the table.</div></div>`)
    /* `workbench.module-contents`, minted by the register owner 23 Aug. Was
       `workbench.structure`, which also named the line item's extracted Anaplan
       fields — one code, two surfaces, so a requirement citing it could not be
       traced to a screen. */
    + grp(R('workbench.module-contents', stateIf('workbench.module-contents', moduleContents(0, list))),
      `<div class="st-helper"><b>33 more</b> in this module. Opening one puts it in the middle
        &mdash; it is a thing you go on to work on, not a fact about this list.</div>`);
  return page(E(mod[1]), `Module &middot; ${list.length} of 38 line items &middot; ${E(mod[2])}`,
    main, crumb([[mod[2],'model-home'], [mod[1],'workbench',mod[0]]]));
}

/* `workbench.module-contents` — four states, drawn the day the code was minted.
   A region born without its states drawn is how the last five untraceable
   regions happened. */
function moduleContents(k, list) {
  if (k === 3) return `<div class="st-empty"><p class="st-empty__title">This module has no line items</p>
    <div class="st-empty__body"><p class="st-body-sm">It exists in Anaplan and it is empty. <b>That
     is a fact about the model, not a loading state</b> &mdash; an empty module usually means work
     that was started and abandoned, and it is worth somebody knowing.</p></div></div>`;
  const sel = k === 2;
  return `${sel ? `<div class="st-table__batchbar"><span class="st-fill">2 selected</span>
     <button class="st-btn st-btn--tertiary st-btn--sm">Assign to area</button>
     <button class="st-btn st-btn--tertiary st-btn--sm">Mark deprecated</button></div>` : ''}
   <div class="st-table-wrap"><table class="st-table">
    <thead><tr>${sel ? '<th scope="col" style="width:44px"><span class="st-visually-hidden">Select</span></th>' : ''}${
      ['Line item','Class','Described','Feeds'].map((h, j) => sortHead(h, j === 0 ? 'ascending' : null)).join('')}</tr></thead>
    <tbody>${list.map((x, i) => `<tr class="st-table__rowlink" data-item="${i}">
      ${sel ? `<td data-stop><label><input type="checkbox" class="st-check"${i < 2 ? ' checked' : ''} aria-label="Select ${E(x[0])}"><span class="st-check__box"></span></label></td>` : ''}
      <td class="st-nowrap"><a class="st-code" href="#workbench" data-item="${i}">${E(x[0])}</a>${
        k === 1 && i === 2 ? ' <span class="st-tag st-tag--sm st-tag--amber">changed in Anaplan</span>' : ''}</td>
      <td class="st-nowrap">${E(x[1])}</td>
      <td>${tag(x[2])}</td>
      <td class="st-num">${x[3]}</td></tr>`).join('')}
    </tbody></table></div>
   ${k === 1 ? `<div class="st-helper"><b>Uplift % changed in Anaplan on 21 August</b>, after its
     description was agreed. The mark is on the row rather than in a banner, because the thing that
     changed is one row and a banner would put doubt over all five.</div>` : ''}
   ${sel ? `<div class="st-helper"><b>Per-row actions are disabled while a selection is active.</b>
     Two ways to act on the same rows at the same time is how somebody deprecates one thing while
     meaning to deprecate five.</div>` : ''}`;
}

/* ---- the line item: it occupies the middle ---- */
function itemScreen(mod, list, li) {
  const undoc = li[2] === 'undocumented';
  const main = R('workbench.trust-strip', stateIf('workbench.trust-strip', undoc
     ? trust('amber','Nobody has described this.','It is one of 247 with no description at all.')
     : trust('green','Agreed by a person on 26 July','and nothing upstream has changed since. Provenance survives whatever else changes.')))

  + grp(`<div class="st-section__head"><h2 class="st-heading-sm">What Anaplan says</h2>
       <span class="st-tag st-tag--sm">extracted &middot; locked</span></div>`,
     R('workbench.structure', stateIf('workbench.structure', structure(li[4] ? {locked:true} : {noformula:true, locked:true}))),
     `<div class="st-helper">These came from Anaplan and there is no write path back to them.</div>`)

  + grp(`<div class="st-section__head"><h2 class="st-heading-sm">What it is for</h2>${tag(li[2])}</div>`,
     R('workbench.meaning', stateIf('workbench.meaning', meaning(undoc ? {empty:true} : {}))),
     `<div class="st-helper">${undoc
        ? 'Undocumented. Answers that touch it will say so rather than answering around it.'
        : 'Agreed by A. Rahman, 26 Jul. Editing it makes it unconfirmed again.'}</div>`,
     R('workbench.scope-ack', stateIf('workbench.scope-ack', scopeAck('none'))),
     R('workbench.save-row', stateIf('workbench.save-row', saveRow(S.dirty ? 'dirty' : 'idle'))))

  /* The four things that are substantial enough to want the panel. Each states
     its size on the way in, so nobody opens one to find out how big it is.
     `button.st-tile` is the system's own reset now — the previous revision carried
     `style="width:100%;text-align:start;border-width:1px"` on all eleven of these. */
  + grp(`<div class="st-section__head"><h2 class="st-heading-sm">More about this line item</h2></div>`,
     `<div class="st-grid">
       ${[['walk-up','What it needs','2 line items feed it, two hops out'],
          ['walk-down','What needs it','141 depend on it, 118 beyond three hops'],
          ['history','History','6 versions, back to the first read'],
          ['agent','What the agent is given','4.2k of a 64k budget']].map(o =>
        `<div class="st-col st-col--half"><button class="st-tile st-tile--clickable${S.pane === o[0] ? ' st-tile--selected' : ''}"
           data-pane="${o[0]}">
          <span class="st-tile__title">${E(o[1])}</span>
          <span class="st-tile__body">${E(o[2])}</span></button></div>`).join('')}
      </div>`,
     `<div class="st-helper">Each of these opens beside this record rather than replacing it
       &mdash; you keep the formula in view while you read what it touches.</div>`);

  return page(E(li[0]), `Line item &middot; ${E(li[1])} &middot; in ${E(mod[1])}`,
    withPane(main, S.pane ? itemPane(li, mod) : null),
    crumb([[mod[2],'model-home'], [mod[1],'workbench',mod[0]], [li[0],'workbench']]));
}

V.workbench = () => {
  const mod = MODULES.find(m => m[0] === S.anchor) || MODULES[0];
  const list = LINEITEMS[mod[0]] || LINEITEMS.SAL03;
  const li = S.item == null ? null : list[S.item];
  return li ? itemScreen(mod, list, li) : moduleScreen(mod, list);
};

function itemPane(li, mod) {
  const T = {'walk-up':['What it needs','Upstream &middot; what feeds this line item'],
             'walk-down':['What needs it','Downstream &middot; what a change here would reach'],
             'history':['History','Every version, with who changed it and when'],
             'agent':['What the agent is given','The exact payload, and what a scope rule excludes']}[S.pane];
  let body;
  if (S.pane === 'walk-up')        body = R('workbench.connections', stateIf('workbench.connections', walkView('up')));
  else if (S.pane === 'walk-down') body = R('workbench.connections', stateIf('workbench.connections', walkView('down')));
  /* `workbench.element-history`, minted by the register owner 23 Aug. FR-408
     pointed at `activity.sequence`, which is the trail for the whole model;
     this is that collection narrowed to one element, with a different empty
     state — "this has never been edited" is not "nothing has happened here". */
  else if (S.pane === 'history')   body = R('workbench.element-history', stateIf('workbench.element-history', elementHistory(0)));
  else body = R('workbench.agent-preview', stateIf('workbench.agent-preview', agentPreview({})));
  return panel(T[0], T[1], body, S.pane === 'agent' ? 'workbench.agent-preview' : 'workbench.connections');
}

  [1,2,[['CST02.salary_cost_gbp','Local currency at the monthly rate','API'],
        ['CST04.on_costs',null,'formula']]],
  [2,7,[['CST09.total_emp_cost','Salary plus on-costs','API'],
        ['RPT01.people_cost','Board pack line 4','API']]],
  [3,14,[['RPT07.regional_summary',null,'API']]]]},
 up:{ total:2, beyond:0, hops:[
  [1,2,[['SAL03.base_salary_cost','Contracted annual salary, pro-rated by month','API'],
        ['SAL03.uplift_pct',null,'API']]],
  [2,3,[['EMP01.fte','Headcount in full-time equivalents','API'],
        ['SAL01.grade_rate','Annual base rate by grade','formula'],
        ['PAY09.pension_rate',null,'API']]]]},
};

/* Routes. Downstream a route ends at an output nothing consumes; upstream it
   ends at an input nothing feeds. Each step carries the formula the value

const PATHS = {
 down:[
  {to:'RPT01.people_cost', label:'RPT01 Total People Cost — board pack line 4', steps:[
   ['SAL03.salary_cost_lc','Base Salary Cost * (1 + Uplift %)',null,'origin'],

   ['RPT01.people_cost','SUM(Total Employment Cost)','summed across business units into','terminal'],
  ]},
  {to:'RPT07.regional_summary', label:'RPT07 Regional Summary — undocumented', steps:[
   ['SAL03.salary_cost_lc','Base Salary Cost * (1 + Uplift %)',null,'origin'],
   ['CST02.salary_cost_gbp','Salary Cost LC * FX Rate Applied','multiplied by the monthly rate into'],
   ['CST09.total_emp_cost','SUM(Salary Cost GBP) + On-costs','summed across employees into'],
   ['RPT07.regional_summary','SUM(Total Employment Cost) BY Region','grouped by region into','terminal'],
  ]},
 ],
 up:[
  {to:'EMP01.fte', label:'EMP01 FTE — read from Employee Master', steps:[
   ['SAL03.salary_cost_lc','Base Salary Cost * (1 + Uplift %)',null,'origin'],
   ['SAL03.base_salary_cost','Grade Rate * FTE','takes Base Salary Cost from'],

  ]},
  {to:'SAL01.grade_rate', label:'SAL01 Grade Rate — an input nobody calculates', steps:[
   ['SAL03.salary_cost_lc','Base Salary Cost * (1 + Uplift %)',null,'origin'],
   ['SAL03.base_salary_cost','Grade Rate * FTE','takes Base Salary Cost from'],
   ['SAL01.grade_rate','input — nothing feeds this','takes Grade Rate from','terminal'],
  ]},
  {to:'SAL03.uplift_pct', label:'SAL03 Uplift % — an input, and undocumented', steps:[
   ['SAL03.salary_cost_lc','Base Salary Cost * (1 + Uplift %)',null,'origin'],
   ['SAL03.uplift_pct','input — nothing feeds this','takes Uplift % from','terminal'],

 ],

/* Two ways of looking at one direction, and they answer different questions:
   how far does this reach, and what is the route to one particular end. Both
   are `.st-lineage` now — `--path` was adopted into the system on 6 Sep, so the
   40 lines this artefact used to carry for it are gone. */
function walkView(dir, o) {
  o = o || {};
  const mode = o.full ? 'reach' : (S.walkMode || 'reach');
  const routes = PATHS[dir];
  const chooser = `<div class="st-btn-group">
     ${[['reach','How far it reaches'], ['path','Follow one route']].map(m =>
      `<button class="st-btn st-btn--${mode === m[0] ? 'secondary' : 'tertiary'} st-btn--sm" data-walkmode="${m[0]}">${m[1]}</button>`).join('')}
    </div>`;
  if (mode === 'reach') return grp(chooser, lineage(dir, o));
  const idx = Math.min(S.pathIx || 0, routes.length - 1);
  return grp(chooser,
    `<div class="st-formitem st-formitem--full">
      <label class="st-lbl" for="pth">${dir === 'down' ? 'Where it comes out' : 'Back to which source'}</label>
      <select class="st-field" id="pth" data-path>${routes.map((r, i) =>
        `<option value="${i}"${i === idx ? ' selected' : ''}>${E(r.label)}</option>`).join('')}</select></div>`,
    path(dir, routes[idx]),
    `<div class="st-helper">${dir === 'down'
      ? `<b>${routes.length} of the 141</b> downstream elements are outputs nothing consumes. Those are
         the ends worth tracing to; the rest are steps on the way.`
      : `<b>${routes.length} sources</b> feed this, and a source is where the chain genuinely stops
         &mdash; an input or a read, with no formula behind it.`}</div>`);
}

function path(dir, route) {
  return `<div class="st-lineage st-lineage--path">
    <ul class="st-lineage__nodes">
     ${route.steps.map(st => {
       const kind = st[3];
       return `<li class="st-lineage__step${kind === 'terminal' ? ' st-lineage__step--terminal' : ''}${kind === 'origin' ? ' st-lineage__step--origin' : ''}">
         ${st[2] ? `<span class="st-lineage__via">${dir === 'up' ? '&uarr;' : '&darr;'} ${E(st[2])}</span>` : ''}
         <span class="st-code">${E(st[0])}</span>
         ${kind === 'origin' ? '<span class="st-tag st-tag--sm">you are here</span>' : ''}
         ${kind === 'terminal' ? `<span class="st-tag st-tag--sm st-tag--blue">${dir === 'down' ? 'final output' : 'source'}</span>` : ''}
         <span class="st-lineage__rule">${E(st[1])}</span>
       </li>`; }).join('')}
    </ul>
    <div class="st-lineage__horizon">
      <span class="st-helper">${dir === 'down'
        ? '<b>Four steps, and the formula at each one.</b> A change to the line item you are on moves this number by whatever these four calculations do to it.'
        : '<b>The chain stops here.</b> Nothing feeds a source, so this is where an explanation of the value actually begins.'}</span></div>
   </div>`;
}

function lineage(dir, o) {
  o = o || {};
  const w = WALK[dir];
  const node = (n) => {
    const open = S.walkOpen === n[0];
    const restricted = n[0] === 'PAY09.pension_rate';
    return `<li class="st-lineage__node${open ? ' st-lineage__node--open' : ''}${restricted ? ' st-lineage__node--restricted' : ''}">
      ${restricted
        ? `<span class="st-code">${E(n[0])}</span>
           <span class="st-lineage__desc">restricted &mdash; the reference is visible, the content is withheld</span>`
        : `<button class="st-lineage__node-toggle" type="button" data-walk="${E(n[0])}"
             aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} what feeds ${E(n[0])}">${CHEV}</button>
           <a class="st-code" href="#workbench" data-go="workbench">${E(n[0])}</a>
           ${n[1] ? `<span class="st-lineage__desc">${E(n[1])}</span>`
                  : `<span class="st-tag st-tag--sm st-tag--amber">undocumented</span>
                     <button class="st-btn st-btn--tertiary st-btn--sm">draft a note</button>`}
           ${n[2] === 'formula' ? `<span class="st-tag st-tag--sm st-tag--outline">from a formula</span>` : ''}`}
      ${open ? `<ul class="st-lineage__nest st-lineage__nodes">
        <li class="st-lineage__node"><a class="st-code" href="#workbench">EMP01.fte</a>
          <span class="st-lineage__desc">Headcount in full-time equivalents</span></li>
        <li class="st-lineage__node st-lineage__node--restricted"><span class="st-code">PAY09.pension_rate</span>
          <span class="st-lineage__desc">restricted &mdash; reference visible, content withheld</span></li>
       </ul>` : ''}
    </li>`;
  };
  const label = dir === 'up' ? 'upstream' : 'downstream';
  const hops = w.hops.length;
  return `<div class="st-lineage st-lineage--${label}">
    <div class="st-lineage__origin"><span class="st-code">SAL03.salary_cost_lc</span>
      <span class="st-helper">${label} &middot; ${hops} hop${hops === 1 ? '' : 's'} shown${
        w.beyond ? ` &middot; ${w.beyond} beyond` : ' &middot; nothing further out'}</span></div>
    ${w.hops.map(([h, count, ns]) => `<section class="st-lineage__hop" aria-labelledby="hop-${dir}-${h}">
      <h3 class="st-lineage__hoplabel" id="hop-${dir}-${h}">
        ${dir === 'up' ? 'Feeds it &mdash; hop' : 'It feeds &mdash; hop'} ${h}
        <span class="st-lineage__hopcount">${count} item${count === 1 ? '' : 's'}</span></h3>
      <ul class="st-lineage__nodes">${ns.map(node).join('')}</ul>
      ${count > ns.length ? `<button class="st-lineage__more st-btn st-btn--tertiary st-btn--sm">${count - ns.length} more at this hop</button>` : ''}
     </section>`).join('')}
    <div class="st-lineage__horizon">
      ${o.full
        ? `<span class="st-helper"><b>The whole chain, all ${N(w.total)} of it.</b> Loaded on request
            rather than by default &mdash; three hops answers most questions in under a second, and
            141 nodes does not. What you gain is completeness; what you pay is the wait.</span>`
        : o.parsed
        ? `<span class="st-helper"><b>One edge here came from parsing a formula</b>, not from
            Anaplan's own dependency list, and it is marked. A parsed edge is a reading of text
            &mdash; it can be wrong in a way an extracted edge cannot.</span>`
        : w.beyond
        ? `<button class="st-btn st-btn--tertiary st-btn--sm" data-st="workbench.connections" data-sti="1">${w.beyond} more, ${hops + 1} hops and further</button>
           <span class="st-helper">The chain always exists; only the view is staged.</span>`
        : `<span class="st-helper"><b>That is the whole chain.</b> Nothing feeds this beyond
            hop ${hops} &mdash; and <b>nothing</b> is a real answer here, not an empty list.</span>`}
     </div>
   </div>`;
}

const VERSIONS = [

 ['v5','26 Jul 13:41','the machine','machine draft','Converts salary to local currency prior to the monthly aggregation.',

/* `workbench.element-history` — four states. Same shape as the model trail and
   a different question, which is why it earned its own code. */
function elementHistory(k) {
  if (k === 1) return grp(
   `<div class="st-helper"><b>Nothing here was ever overwritten.</b> Every save appends a version.</div>`,
   `<div class="st-empty"><p class="st-empty__title">One version, and it is the first read</p>
    <div class="st-empty__body"><p class="st-body-sm">This element has never been edited by anybody.
     What you are looking at is exactly what came out of Anaplan on 4 August. <b>That is different
     from "nothing has happened in this model"</b> &mdash; plenty has, just not here.</p></div></div>`);
  if (k === 2) return grp(
   `<div class="st-note"><div><b>Version 7 restored the text of version 4.</b> The revert is a new
     version, not a deletion &mdash; versions 5 and 6 are still here and still readable, because
     what somebody tried is evidence even when it was wrong.</div></div>`, history());
  if (k === 3) return grp(
   `<div class="st-note"><div><b>Version 6 was written by the agent and approved by d.xing at
     09:38.</b> Both names are on it. <b>A version with only one of the two is not a record of what
     happened</b> — the machine proposed and a person let it through, and either half alone
     misattributes the decision.</div></div>`, history());
  return history();
}

function history() {
  const open = S.verOpen || 'v6';
  const vtag = v => v === 'reverted'
    ? '<span class="st-tag st-tag--sm st-tag--teal">reverted</span>' : tag(v);
  /* A plain list in a stack. The previous revision reached for
     `.st-lineage__nodes` here and then undid it with three inline styles —
     borrowing a component's internal part for an unrelated list. */
  return grp(
    `<div class="st-helper"><b>Nothing here was ever overwritten.</b> Every save appends a version,
      and a revert writes a new one restoring the earlier text &mdash; so the thing you replaced is
      still readable.</div>`,
    `<ul class="st-stack" style="--gap:var(--st-space-03);list-style:none;padding:0;margin:0">
      ${VERSIONS.map(v => `<li>
        <button class="st-tile st-tile--clickable${open === v[0] ? ' st-tile--selected' : ''}" data-ver="${v[0]}">
         <span class="st-tile__title"><span class="st-code">${v[0]}</span>
           <span class="st-fill"> ${E(v[1])} &middot; ${E(v[2])}</span> ${vtag(v[3])}</span>
         ${open === v[0] ? `<span class="st-tile__body">
            <span class="st-codeblock st-codeblock--line" style="display:block;margin-top:var(--st-space-03)">${E(v[4])}</span>
            <span class="st-helper" style="display:block;margin-top:var(--st-space-03)">${E(v[5])}</span></span>` : ''}
        </button></li>`).join('')}
     </ul>`,
    `<div class="st-btn-group">
      <button class="st-btn st-btn--tertiary st-btn--sm">Compare v6 with v4</button>
      <a class="st-link" href="#activity" data-go="activity">See these in the full trail</a></div>`);
}
