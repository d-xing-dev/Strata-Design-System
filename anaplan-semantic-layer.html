    <p class="st-label st-text-secondary">This code expired</p>
    <p class="st-keycode st-text-secondary" style="text-decoration:line-through">GKQD-2R7F</p>
    <div class="st-btn-group"><button class="st-btn st-btn--primary st-btn--sm">Issue a new code</button></div>
    <div class="st-helper" style="margin-top:var(--st-space-03)"><b>Replaced by an action, not by a failure message.</b> An expired code
     is a thing you fix in one press, so the press is what is on the screen.</div></div></div>`;
  return `<div class="st-tile"><div class="st-tile__body">
    <p class="st-label st-text-secondary">Type this code in the browser</p>
    <p class="st-keycode">GKQD-2R7F</p>
    <div class="st-helper" style="margin-top:var(--st-space-03)">${k === 1
      ? '<b>Expires in 0:47.</b> Under a minute is called out, because a code that dies while you are typing it is the most annoying way this can fail.'
      : 'Expires in 4:12. Under a minute left it says so; expired, it is replaced by a re-issue action rather than simply failing.'}</div>
    </div></div>`;
}

function revoked(k) {
  if (k === 0) return `<div class="st-helper">Hidden unless access is removed upstream.</div>`;
  return `<div class="st-note st-note--error"><div>
    <b>Your access to Meridian Retail was removed.</b> The Anaplan administrator
    <b>j.okafor</b> revoked this workspace grant on 22 August at 16:40.
    <div class="st-helper" style="margin-top:var(--st-space-03)">Named, not guessed &mdash;
     where Anaplan does not tell us who, this says so rather than leaving a blank.
     <b>Your local knowledge store is untouched and still readable</b>: what you lose is the
     ability to refresh it or write back, not what you already understood.</div>
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--secondary st-btn--sm" data-go="registry">Switch to another client</button>
     <button class="st-btn st-btn--tertiary st-btn--sm" data-force="">Dismiss</button></div>
   </div></div>`;
}

V.signin = () => page('Sign in to Anaplan',
  'One client at a time. Switching to another signs you out of this one first.',
  R('sign-in.state-banner', stateIf('sign-in.state-banner', signinBanner(0)))
  + R('sign-in.device-code', stateIf('sign-in.device-code', deviceCode(0)))
  + R('sign-in.fallback-link', stateIf('sign-in.fallback-link',
     `<p class="st-body-sm">The browser did not open?
      <a class="st-link" href="#signin">Open anaplan.com/device yourself</a> &mdash;
      <b>this is always shown</b>, whether or not the browser opened, because a link that only
      appears once something has gone wrong is a link nobody trusts.</p>`))
  + R('sign-in.revoked-notice', stateIf('sign-in.revoked-notice', revoked(S.force === 'revoked' ? 1 : 0))));

/* ---------------- add a model ----------------
   Seven regions, 28 recorded states. The rule that shapes most of these: a stage
   that fails is named, and the run does not become a spinner with an apology
   after it. Somebody is watching a 312-module read and deciding whether to walk
   away, and "something went wrong" does not help them decide. */
function stepNav(k) {
  const step = {0:1, 1:2, 2:3, 3:4}[k] || 1;
  const done = k === 3;
  /* One wrapper, because the sentence that explains the step IS part of the step
     nav's state — a region whose data-region attribute lands on only the first
     child leaves the differentiating text outside the region, and a walk then
     reports two different states as identical. Found by the walk. */
  return `<div class="st-stack" style="--gap:var(--st-space-04)"><ol class="st-steps">
    ${[['Choose the model',1], ['Check before reading',2], ['Read it in',3]].map(([t, n]) => {
      const cls = done || n < step ? 'st-step--done' : n === step ? 'st-step--current' : 'st-step--todo';
      const locked = k === 2 && n < 3;
      return `<li class="st-step ${cls}">
        <span class="st-step__text">${E(t)}<span class="st-step__pos">${
          locked ? 'locked while the read runs' : done ? 'done' : 'step ' + n + ' of 3'}</span></span></li>`;
     }).join('')}
   </ol>${k === 1 ? `<div class="st-helper">Step 1 stays open behind you &mdash; you can go back and
     change the model without losing this.</div>` : ''}${k === 2 ? `<div class="st-helper"><b>The steps
     behind are locked while the read runs.</b> Changing the scope mid-read would leave a store that
     is half one model and half another, and there is no honest way to label that.</div>` : ''}${
     k === 0 ? `<div class="st-helper">Nothing has been read yet and nothing has been written.</div>` : ''}${
     k === 3 ? `<div class="st-helper">All three steps done. The model is in and its first draft is
      waiting for you in <b>Needs you</b>.</div>` : ''}</div>`;
}

function scopePicker(k) {
  const F = (l, v, extra) => `<div class="st-col st-col--third"><div class="st-formitem st-formitem--full">
     <label class="st-lbl" for="ob-${l}">${l}</label>
     <select class="st-field" id="ob-${l}"${extra || ''}><option>${v}</option></select></div></div>`;
  if (k === 3) return `<div class="st-empty"><p class="st-empty__title">This token can see no models</p>
    <div class="st-empty__body"><p class="st-body-sm">The sign-in worked and the workspace answered.
     <b>It returned zero models</b>, which is a permissions answer rather than an empty one &mdash;
     somebody with access to the workspace has not been given access to anything inside it.</p>
    <div class="st-btn-group"><button class="st-btn st-btn--tertiary st-btn--sm">Choose another workspace</button>
     <button class="st-btn st-btn--tertiary st-btn--sm">Who do I ask?</button></div></div></div>`;
  if (k === 4) return `<div class="st-empty st-empty--error"><p class="st-empty__title">The list did not come back</p>
    <div class="st-empty__body"><p class="st-body-sm">Anaplan did not answer the request for workspaces
     within 30 seconds. <b>Nothing is wrong with your choice</b> &mdash; nothing has been chosen yet.</p>
    <div class="st-btn-group"><button class="st-btn st-btn--secondary st-btn--sm">Try again</button></div>
    <p class="st-helper">Retrying costs nothing and writes nothing. <b>A listing failure is never a
     dead end</b> &mdash; there is always a way forward from this screen.</p></div></div>`;
  return `<div class="st-grid">
     ${F('Client', k === 0 ? 'Choose a client' : 'Meridian Retail')}
     ${F('Workspace', k === 0 ? '&mdash;' : k === 1 ? 'Loading&hellip;' : 'Planning &mdash; EMEA', k === 0 || k === 1 ? ' disabled' : '')}
     ${F('Model', k === 0 || k === 1 ? '&mdash;' : 'WFP Workforce Planning', k === 0 || k === 1 ? ' disabled' : '')}
    </div>
    <div class="st-helper">${k === 1
      ? 'Reading the workspaces this token can see. <b>Live, not cached</b> &mdash; a workspace added this morning appears now.'
      : 'These lists are read live from Anaplan, not from anything cached. If the token can see no models, that is stated rather than shown as an empty list.'}</div>`;
}

function scopeSummary(k) {
  if (k === 1) return `<div class="st-note st-note--warning"><div>
    <b>WFP Workforce Planning &mdash; 312 modules.</b> That is above the scale threshold in Settings,
    so this read will take longer and cost more. <b>You are warned, not blocked.</b></div></div>`;
  if (k === 2) return `<div class="st-note"><div><b>WFP Workforce Planning &mdash; module count
    unavailable.</b> The model answers, but it did not return a count before the timeout.
    <b>That is stated rather than guessed</b>: a number here that turned out to be wrong would be
    worse than no number, because it is the number you would use to decide whether to wait.</div></div>`;
  return `<div class="st-note st-note--success"><div><b>WFP Workforce Planning &mdash; 312 modules,
    11,847 line items.</b> Within the thresholds in Settings.</div></div>`;
}

function preflight(k) {
  const rows = {
   0:[['A token for this client','Present, expires in 6 days','green'],
      ['The model answers','Yes &mdash; 312 modules, 11,847 line items','green'],
      ['A store already exists','No &mdash; this is a first read','green'],
      ['Scale','Within the threshold','green']],
   1:[['A token for this client','<b>Missing or expired</b>','red'],
      ['The model answers','Not checked &mdash; needs the token',''],
      ['A store already exists','Not checked',''],
      ['Scale','Not checked','']],
   2:[['A token for this client','Present, expires in 6 days','green'],
      ['The model answers','<b>No answer in 30 seconds</b>','red'],
      ['A store already exists','Not checked',''],
      ['Scale','Not checked','']],
   3:[['A token for this client','Present, expires in 6 days','green'],
      ['The model answers','Yes &mdash; 312 modules','green'],
      ['A store already exists','<b>Yes &mdash; built 4 August</b>','amber'],
      ['Scale','Above the threshold &mdash; warned','amber']],
   4:[['A token for this client','Present, expires in 6 days','green'],
      ['The model answers','Yes &mdash; 312 modules','green'],
      ['A store already exists','No','green'],
      ['Scale','<b>312 modules, over the 250 threshold</b>','amber']]}[k];
  const tail = {
   1:`<div class="st-note st-note--error"><div><b>You need to sign in to Meridian Retail first.</b>
      <b>You will come back here</b>, with these choices still made &mdash; signing in does not
      restart the wizard.
      <div class="st-btn-group" style="margin-top:var(--st-space-03)"><button class="st-btn st-btn--secondary st-btn--sm" data-go="signin">Sign in</button></div></div></div>`,
   2:`<div class="st-note st-note--error"><div><b>The model did not answer.</b> Nothing has been read
      and nothing has been written. This is a check, and a check that fails costs nothing.
      <div class="st-btn-group" style="margin-top:var(--st-space-03)"><button class="st-btn st-btn--secondary st-btn--sm">Check again</button></div></div></div>`,
   4:`<div class="st-note st-note--warning"><div><b>Above the scale threshold set in Settings.</b>
      This read will take longer and cost more of the monthly budget. <b>You are warned, not
      blocked</b> &mdash; the threshold exists to make the cost visible before you spend it, not to
      decide for you.</div></div>`}[k] || '';
  return `<div class="st-table-wrap"><table class="st-table">
    <thead><tr><th scope="col">Check</th><th scope="col">Result</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[2]
      ? `<span class="st-tag st-tag--sm st-tag--${r[2]}">${r[1]}</span>`
      : `<span class="st-text-secondary">${r[1]}</span>`}</td></tr>`).join('')}
    </tbody></table></div>${tail}`;
}

function collision(k) {
  if (k === 0) return '';
  return `<div class="st-note st-note--warning"><div>
    <b>This model has been read before</b> &mdash; a store was built on 4 August.
    <b>Neither of these is the default</b>, because the right answer depends on something only you
    know: whether Anaplan has changed in a way that matters to you.
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--secondary st-btn--sm" data-go="model-home">Open what we already have</button>
     <button class="st-btn st-btn--secondary st-btn--sm" data-step="3">Read it again and diff</button></div>
    <div class="st-helper" style="margin-top:var(--st-space-03)">Reading again does not overwrite the old one. It produces a difference
     you approve, so nothing agreed by a person is lost to a machine read.</div></div></div>`;
}

const PHASES = ['Listing','Modules','Line items','Lists','Formulas','Index','Descriptions'];
function phaseProgress(k) {
  const at = {0:3, 1:3, 2:3, 3:7, 4:2}[k];
  const failed = k === 1;
  return `<div class="st-stack" style="--gap:var(--st-space-04)"><ol class="st-steps">
    ${PHASES.map((t, i) => {
      const cls = i < at ? 'st-step--done' : (failed && i === at) ? 'st-step--failed'
        : i === at ? 'st-step--current' : 'st-step--todo';
      return `<li class="st-step ${cls}">
       <span class="st-step__text">${E(t)}<span class="st-step__pos">stage ${i + 1} of 7</span></span></li>`;
     }).join('')}
   </ol>
   ${{0:`<div class="st-helper"><b>Named stages, never a spinner.</b> You can tell how far in you are
      and therefore whether to wait &mdash; which is the only decision this display supports.</div>`,
      1:`<div class="st-note st-note--error"><div><b>Stage 4, Lists, failed.</b> One list has 68,402
      members and the request for its members was refused as too large. <b>The three stages before it
      are kept</b> &mdash; modules and line items are read and will not be re-read.
      <div class="st-btn-group" style="margin-top:var(--st-space-03)">
       <button class="st-btn st-btn--secondary st-btn--sm">Continue without that list</button>
       <button class="st-btn st-btn--tertiary st-btn--sm">Retry just this stage</button></div>
      <div class="st-helper" style="margin-top:var(--st-space-03)">Continuing is allowed and the gap is recorded: every answer that touches
       that list will say the members were not read.</div></div></div>`,
      2:`<div class="st-note st-note--warning"><div><b>Stage 4 is retrying &mdash; attempt 2 of 5.</b>
      The last response was a rate limit, which passes. <b>The attempt number is shown because five
      silent retries and one real failure look identical</b> from outside.</div></div>`,
      3:`<div class="st-note st-note--success"><div><b>All seven stages complete.</b>
      Read in 4 minutes 12 seconds.</div></div>`,
      4:`<div class="st-helper"><b>The same seven stages run on every refresh</b>, so progress means
      the same thing in both places. This is a refresh of a model read on 4 August, not a first
      read &mdash; stages that find nothing changed complete immediately.</div>`}[k]}</div>`;
}

function draftReport(k) {
  const kv = {
   0:[['Described','1,847 of 11,847 &mdash; all machine drafts'],
      ['Cost','6,120 tokens of a 40,000 budget'],
      ['Smoke test','<span class="st-tag st-tag--sm st-tag--green">passed</span> &mdash; one structural question answered with citations']],
   1:[['Described','<b>1,102 of 11,847</b> &mdash; fewer than planned'],
      ['Cost','<b>40,000 of 40,000</b> &mdash; the month&rsquo;s budget is spent'],
      ['Smoke test','<span class="st-tag st-tag--sm st-tag--green">passed</span>']],
   2:[['Described','1,847 of 11,847 &mdash; all machine drafts'],
      ['Cost','6,120 tokens of a 40,000 budget'],
      ['Smoke test','<span class="st-tag st-tag--sm st-tag--green">passed</span> &mdash; asked how Salary Cost LC is built; the answer cited three elements and all three resolved']],
   3:[['Described','1,847 of 11,847 &mdash; all machine drafts'],
      ['Cost','6,120 tokens of a 40,000 budget'],
      ['Smoke test','<span class="st-tag st-tag--sm st-tag--red">failed</span>']]}[k];
  const tail = {
   0:`<div class="st-helper">Nothing here is agreed by a person yet.</div>`,
   1:`<div class="st-note st-note--warning"><div><b>The budget ran out part-way, and the drafting
      degraded rather than truncating.</b> That means 745 fewer descriptions &mdash; <b>not 745
      half-written ones</b>. Every element either has a whole draft or is marked undocumented, and
      nothing in between reached the store.</div></div>`,
   2:`<div class="st-helper"><b>The smoke test is one real question, asked and checked.</b> A read
      that completes without answering anything is a read that filled a database, and that is not
      what this product is for.</div>`,
   3:`<div class="st-note st-note--warning"><div><b>The smoke test failed and onboarding still
      completed.</b> The question was answered, but one cited element did not resolve back to the
      model. The store is real and usable; <b>it is marked as unverified</b> and the mark stays until
      a test passes. Failing the test does not justify throwing away four minutes of reading.</div></div>`}[k];
  return `<div class="st-tile"><div class="st-tile__title">What the first read produced</div>
    <div class="st-tile__body">${grp(
      `<dl class="st-kv">${kv.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`, tail)}</div></div>`;
}

V.onboard = () => {
  const step = S.step || 1;
  const nav = R('onboard.step-nav', stateIf('onboard.step-nav', stepNav(step - 1)));
  let body;
  if (step === 1) {
    body = R('onboard.scope-picker',  stateIf('onboard.scope-picker',  scopePicker(2)))
         + R('onboard.scope-summary', stateIf('onboard.scope-summary', scopeSummary(1)));
  } else if (step === 2) {
    body = R('onboard.preflight-summary', stateIf('onboard.preflight-summary', preflight(3)))
         + R('onboard.collision-choice',  stateIf('onboard.collision-choice',  collision(1)));
  } else {
    body = R('onboard.phase-progress', stateIf('onboard.phase-progress', phaseProgress(0)))
         + R('onboard.draft-report',   stateIf('onboard.draft-report',   draftReport(0)));
  }
  return page('Add a model', 'What you are about to read in, and how far it has got.',
    nav + body + `<div class="st-btn-group">
      ${step > 1 ? `<button class="st-btn st-btn--tertiary" data-step="${step - 1}">Back</button>` : ''}
      ${step < 3 ? `<button class="st-btn st-btn--primary" data-step="${step + 1}">Continue</button>`
        : `<button class="st-btn st-btn--primary" data-go="queue">Review what it drafted</button>`}</div>`,
    crumb([['Models','registry'], ['Add a model','onboard']]));
};

/* ---------------- version conflict ----------------
   Three regions, 12 states. One rule runs through all of them: NEITHER VERSION
   WINS BY DEFAULT. The resolution box starts empty, save is refused while it is
   empty, and both versions are shown in full. A conflict screen that pre-fills
   one side has already chosen, and the person clicking Save is only agreeing to
   something they were not asked about. */
function sideBySide(k) {
  const theirs = {
   0:['Converts salary to local currency at the month-end rate.','<div class="st-helper">Agreed by james.t at 09:41.</div>'],
   1:['Converts salary to local currency at the month-end rate.',
      '<div class="st-note st-note--warning" style="margin-top:var(--st-space-03)"><div><b>Theirs is also a machine draft.</b> Nobody has confirmed it either &mdash; so this is not "your edit against an agreed description", it is two unconfirmed drafts, and neither has standing over the other.</div></div>'],
   2:['<span class="st-text-secondary">no description</span>',
      '<div class="st-note st-note--error" style="margin-top:var(--st-space-03)"><div><b>They removed the description.</b> Deleting is a change like any other and it is shown as one. The old text is in the trail and is not gone.</div></div>']}[k];
  return `<div class="st-compare">
    <div class="st-compare__panel"><div class="st-compare__label">Theirs &mdash; saved 09:41 by james.t</div>
      <p class="st-compare__body st-body-sm">${theirs[0]}</p>${theirs[1]}</div>
    <div class="st-compare__panel"><div class="st-compare__label">Yours &mdash; unsaved</div>
      <p class="st-compare__body st-body-sm">Converts salary to local currency before the monthly aggregation.</p></div>
   </div>
   <div class="st-helper" style="margin-top:var(--st-space-04)">Both are shown in full. <b>Nothing about a conflict is disclosed away</b>
    &mdash; a hidden half is how the wrong version gets chosen.</div>`;
}

function resolutionEntry(k) {
  const V2 = {0:'', 1:'Converts salary to local currency before the monthly aggregation, using the month-end rate.',
             2:'Converts salary to local currency at the month-end rate, before the monthly aggregation.',
             3:'Applies the month-end FX rate to each salary line before those lines are aggregated to the month.',
             4:''}[k];
  const note = {
   0:`<div class="st-helper"><b>Empty by default &mdash; neither version is assumed.</b> Save is
      refused while it stays empty.</div>`,
   1:`<div class="st-helper">Started from <b>yours</b> and edited. The buttons copy text in; they do
      not choose a winner, and the trail records that you wrote this rather than accepted one.</div>`,
   2:`<div class="st-helper">Started from <b>theirs</b> and edited. Same rule: what is recorded is
      that you wrote this.</div>`,
   3:`<div class="st-helper">Written from scratch &mdash; neither copy button was used. This is the
      common case once somebody reads both and realises both were partly wrong.</div>`,
   4:`<div class="st-note st-note--error"><div><b>Save is refused while this is empty.</b> An empty
      resolution would delete the description, and deleting is a decision that has to be made on
      purpose rather than by leaving a box blank.</div></div>`}[k];
  /* Full width, and now by the system's modifier rather than an inline style.
     What you write here is judged against two panels above it that are each
     690px wide — a 400px box makes the resolution look like a smaller thing than
     either version it replaces, and people write shorter text in a smaller box. */
  return `<div class="st-formitem st-formitem--full">
    <label class="st-lbl" for="cf-res">The version that survives</label>
    <textarea class="st-field" id="cf-res" rows="3"${V2 ? '' : ' placeholder="Empty by default — neither version is assumed."'}>${E(V2)}</textarea>
    <div class="st-btn-group">
     <button class="st-btn st-btn--tertiary st-btn--sm">Start from mine</button>
     <button class="st-btn st-btn--tertiary st-btn--sm">Start from theirs</button></div>
    ${note}</div>`;
}

function conflictActions(k) {
  if (k === 2) return `<div class="st-loading"><span class="st-loading__spinner" aria-hidden="true"></span>
    <span class="st-body-sm">Saving, then re-reading to confirm it landed</span></div>`;
  if (k === 3) return `<div class="st-note st-note--error"><div>
    <b>Rejected again &mdash; somebody saved while you were resolving.</b> There is now a third
    version. <b>Nothing you typed is lost</b>: it is below, and the new version is added beside the
    other two rather than replacing them.
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--secondary st-btn--sm">Show all three</button></div>
    <div class="st-helper" style="margin-top:var(--st-space-03)">This is rare and it is not an
     error in your work. It is what a shared model does at month end.</div></div></div>`;
  if (k === 1) return `<div class="st-btn-group">
    <button class="st-btn st-btn--secondary">Keep theirs, discard mine</button>
    <span class="st-helper">Discarding yours is recorded in the trail with what it said &mdash;
     a version you chose not to keep is still evidence of what was considered.</span></div>`;
  return `<div class="st-btn-group">
    <button class="st-btn st-btn--primary">Save the resolved version</button>
    <button class="st-btn st-btn--secondary">Keep theirs, discard mine</button></div>`;
}

V.conflict = () => page('Two versions of this description',
  'Somebody saved while you were editing. Nothing is merged automatically; you decide.',
  R('conflict.side-by-side',       stateIf('conflict.side-by-side', sideBySide(0)))
  + R('conflict.resolution-entry', stateIf('conflict.resolution-entry', resolutionEntry(0)))
  + R('conflict.action-row',       stateIf('conflict.action-row', conflictActions(0))));

/* ---------------- activity ----------------
   Four regions, 18 states. Its whole claim is that a change can be reconstructed
   afterwards, so the states that matter are the incomplete ones: a write that
   landed in part, a change that was rejected, a proposal a rule stopped before it
   was ever sent. None is deleted. A change that did not happen is evidence about
   what was considered. */
function acknowledge(k) {
  if (k === 0) return `<div class="st-helper">Hidden. Nothing is waiting on an acknowledgement.</div>`;
  if (k === 2) return `<div class="st-note st-note--error"><div>
    <b>Acknowledge that two of five descriptions reached Anaplan?</b>
    <div class="st-helper" style="margin-top:var(--st-space-03)">Acknowledging does two things and
     both are irreversible: it unblocks writing, and it <b>forces a reconcile</b> &mdash; a fresh
     read of the three that did not land, to find out what is actually there now.</div>
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--secondary st-btn--sm">Acknowledge and reconcile</button>
     <button class="st-btn st-btn--tertiary st-btn--sm">Not yet</button></div></div></div>`;
  if (k === 3) return `<div class="st-note st-note--success"><div>
    <b>Acknowledged by d.xing at 09:52, and the reconcile is running.</b> Writing is unblocked.
    <div class="st-helper" style="margin-top:var(--st-space-03)">The acknowledgement is a row in the
     trail like everything else &mdash; who saw the partial write, and when. <b>That is the point of
     the block</b>: not to punish anyone, but to make sure somebody knowingly saw it.</div></div></div>`;
  return `<div class="st-note st-note--error"><div>
    <b>A write finished halfway.</b> Two of five descriptions reached Anaplan. <b>Writing stays
    blocked until you acknowledge this</b>, and acknowledging forces a reconcile.
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--secondary st-btn--sm">Acknowledge and reconcile</button></div></div></div>`;
}

function activitySequence(k) {
  const EX = {
   1:[['2 Aug 09:44','Writing description 3 of 5','d.xing','in flight','blue'],
      ['2 Aug 09:43','Description 2 of 5 written','d.xing','verified','green'],
      ['2 Aug 09:42','Description 1 of 5 written','d.xing','verified','green']],
   2:[['1 Aug 17:02','Write halted at element 3 of 5','d.xing','halted','red'],
      ['1 Aug 17:01','Description 2 of 5 written','d.xing','verified','green'],
      ['1 Aug 17:00','Description 1 of 5 written','d.xing','verified','green']],
   3:[['2 Aug 09:43','Follow-up read confirmed all five','schedule','verified','green'],
      ['2 Aug 09:41','Five descriptions written','d.xing','complete','teal']],
   4:[['2 Aug 10:04','Reconcile complete — three re-read','schedule','reconciled','teal'],
      ['2 Aug 09:52','Partial write acknowledged','d.xing','acknowledged','teal'],
      ['1 Aug 17:02','Write halted at element 3 of 5','d.xing','halted','red']]}[k];
  const rows = EX || ACTS;
  const note = {
   1:`<div class="st-helper"><b>A row appears when the change starts, not when it finishes.</b> A
      trail that only records completions cannot tell you what is happening right now, which is
      exactly when you want to look at it.</div>`,
   2:`<div class="st-helper">The halt is a row, and the two that succeeded before it stay as rows.
      <b>A halted write is not undone</b> &mdash; two descriptions really are in Anaplan.</div>`,
   3:`<div class="st-helper"><b>Verified is a separate row from written</b>, because they are
      separate claims: one says we sent it, the other says we went back and looked.</div>`,
   4:`<div class="st-helper">The reconcile appends; it does not tidy the halt away. <b>Reading this
      trail top to bottom tells the whole story including the part that went wrong</b>, which is the
      only version worth keeping.</div>`}[k] || '';
  return `<div class="st-table-wrap"><table class="st-table">
    <thead><tr>${['When','What','Who','State'].map((h, j) => sortHead(h, j === 0 ? 'descending' : null)).join('')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="st-table__rowlink"${S.panel === i ? ' aria-selected="true"' : ''} data-panel="${i}">
      <td class="st-nowrap"><a href="#activity" data-panel="${i}">${E(r[0])}</a></td>
      <td class="st-nowrap">${E(r[1])}</td><td class="st-nowrap">${E(r[2])}</td>
      <td><span class="st-tag st-tag--sm st-tag--${r[4]}">${E(r[3])}</span></td></tr>`).join('')}
    </tbody></table></div>${note}`;
}

function branchList(k) {
  const R4 = {
   1:[['1 Aug 17:02','Write on RPT01','rejected &mdash; newer version','red']],
   2:[['30 Jul 11:14','Draft on PEN03','superseded by an edit','amber']],
   3:[['28 Jul 09:50','Write on LST04','invalidated before approval','amber']]}[k];
  if (k === 4) return `<div class="st-section"><div class="st-section__head">
     <h2 class="st-heading-sm">Changes that did not complete</h2><span class="st-helper">0</span></div>
    ${grp(`<div class="st-empty"><p class="st-empty__title">Everything that started, finished</p>
      <div class="st-empty__body"><p class="st-body-sm">No write has been rejected, superseded or
       invalidated in this model. <b>That is worth stating rather than showing an empty table</b>
       &mdash; a blank grid reads as a section that has not loaded.</p></div></div>`)}</div>`;
  const rows = R4 || [['1 Aug 17:02','Write on RPT01','rejected &mdash; newer version','red'],
    ['30 Jul 11:14','Draft on PEN03','superseded by an edit','amber'],
    ['28 Jul 09:50','Write on LST04','invalidated before approval','amber']];
  const why = {
   1:`<b>Rejected</b> means Anaplan refused it: a newer version of the element existed by the time
      the write arrived. Nothing was written and nothing was lost.`,
   2:`<b>Superseded</b> means a person edited the element while a machine draft was queued for it.
      The person wins and the draft is kept as evidence of what was suggested.`,
   3:`<b>Invalidated</b> means the thing the proposal described changed before anybody approved it.
      The proposal is about an element that no longer looks like that.`}[k]
   || `<b>None of these is deleted.</b> A change that did not happen is evidence about what was
      considered, and it is kept.`;
  return `<div class="st-section"><div class="st-section__head">
     <h2 class="st-heading-sm">Changes that did not complete</h2>
     <span class="st-helper">${rows.length}</span></div>
    ${grp(`<div class="st-table-wrap"><table class="st-table"><thead><tr>
       <th scope="col">When</th><th scope="col">What</th><th scope="col">Why it stopped</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="st-nowrap">${r[0]}</td><td class="st-nowrap">${r[1]}</td>
       <td><span class="st-tag st-tag--sm st-tag--${r[3]}">${r[2]}</span></td></tr>`).join('')}
      </tbody></table></div>`,
     `<div class="st-helper">${why}</div>`)}</div>`;
}

/* The trail's whole claim is that a change can be reconstructed afterwards, and
   a claim you cannot open is a promise. Four kinds of row, four different
   detail. The discrepancy is reproduced WORD FOR WORD rather than summarised —
   a paraphrase of what Anaplan said is not evidence of what Anaplan said. */
const PROPOSALS = {
 0:{what:'Salary Cost LC &mdash; description replaced',
    before:'no description',
    after:'Converts salary to local currency before the monthly aggregation.',
    rules:[['Descriptions on production models are confirmed by the steward before writing','passed','green','james.t is the steward and is the acting identity'],
           ['A description may not assert a dependency the graph does not carry','passed','green','both named elements resolve'],
           ['Writes to production are re-read to confirm','passed','green','follow-up read at 09:43 returned the same text']],
    disc:null, tail:'<b>Verified.</b> The follow-up read returned exactly what was written, so this row is evidence rather than an intention.'},
 1:{what:'Three descriptions proposed by the agent',
    before:'2 undocumented, 1 machine draft',
    after:'awaiting your approval &mdash; nothing has been written',
    rules:[['Descriptions on production models are confirmed by the steward before writing','disagreed','amber','advisory &mdash; you may approve anyway, and the disagreement is recorded either way'],
           ['Every claim carries a source','passed','green','all three cite the formula they describe']],
    disc:null, tail:'<b>Nothing has reached Anaplan.</b> This row records what was proposed, not what happened.'},
 2:{what:'Scheduled read of WFP Workforce Planning',
    before:'11,847 line items last read 26 Jul',
    after:'11,847 read &middot; 2 changed since &middot; 0 written',
    rules:[['A read never writes','passed','green','no write was attempted']],
    disc:null, tail:'A read that proposes nothing still records that it ran. <b>Absence of change is a finding.</b>'},
 4:{what:'Five descriptions written to Anaplan',
    before:'5 approved and queued',
    after:'<b>2 written, 3 did not land</b>',
    rules:[['Writes to production are re-read to confirm','failed','red','the re-read disagreed on RPT01'],
           ['A partial write blocks further writing until acknowledged','enforced','red','writing is blocked now']],
    disc:'RPT01.people_cost\n409 Conflict\n{"error":"The item has been modified since it was read.",\n "currentVersion":"2026-08-01T17:01:44Z",\n "suppliedVersion":"2026-08-01T16:58:02Z"}',
    tail:'<b>Word for word.</b> Anaplan’s own response is kept because a paraphrase of a rejection is not evidence of a rejection.'}
};
PROPOSALS[3] = PROPOSALS[2];

function proposalDetail(i) {
  const d = PROPOSALS[i]; if (!d) return '';
  return `<div class="st-section"><div class="st-section__head">
     <h3 class="st-heading-sm">What was proposed</h3></div>
    ${grp(`<dl class="st-kv"><dt>Change</dt><dd>${d.what}</dd>
      <dt>Before</dt><dd class="st-text-secondary">${d.before}</dd>
      <dt>After</dt><dd>${d.after}</dd></dl>`)}</div>

   <div class="st-section"><div class="st-section__head">
     <h3 class="st-heading-sm">Rules checked</h3><span class="st-helper">${d.rules.length}</span></div>
    ${grp(`<div class="st-table-wrap"><table class="st-table"><thead><tr>
       <th scope="col">Rule</th><th scope="col">Said</th></tr></thead><tbody>
      ${d.rules.map(r => `<tr><td>${r[0]}<div class="st-helper">${r[3]}</div></td>
        <td class="st-nowrap"><span class="st-tag st-tag--sm st-tag--${r[2]}">${r[1]}</span></td></tr>`).join('')}
      </tbody></table></div>`)}</div>

   ${d.disc ? `<div class="st-section"><div class="st-section__head">
     <h3 class="st-heading-sm">What Anaplan said</h3></div>
    ${grp(`<div><div class="st-codeblock__head">HTTP response
       <span class="st-codeblock__meta">recorded verbatim</span></div>
      <pre class="st-codeblock">${E(d.disc)}</pre></div>`)}</div>` : ''}

   <div class="st-helper">${d.tail}</div>`;
}

/* The register records four states for this, and the row you clicked only
   supplies one of them. The other three are about the RULES rather than about
   the row: a rule that disagreed and was overridden anyway, and a rule that
   stopped the proposal before it was ever sent. */
function proposalDetailK(k) {
  if (k === 0) return proposalDetail(0);
  if (k === 3) return proposalDetail(4);
  if (k === 1) return `<div class="st-section"><div class="st-section__head">
     <h3 class="st-heading-sm">What was proposed</h3></div>
    ${grp(`<dl class="st-kv"><dt>Change</dt><dd>Uplift % &mdash; description written</dd>
      <dt>Before</dt><dd class="st-text-secondary">no description</dd>
      <dt>After</dt><dd>Percentage added to the grade rate before the bracket is applied.</dd></dl>`)}</div>
   <div class="st-section"><div class="st-section__head"><h3 class="st-heading-sm">Rules checked</h3>
     <span class="st-helper">2</span></div>
    ${grp(`<div class="st-table-wrap"><table class="st-table"><thead><tr>
       <th scope="col">Rule</th><th scope="col">Said</th></tr></thead><tbody>
      <tr><td>Descriptions on production models are confirmed by the steward before writing
        <div class="st-helper">advisory &mdash; d.xing is not the steward</div></td>
       <td class="st-nowrap"><span class="st-tag st-tag--sm st-tag--amber">disagreed</span></td></tr>
      <tr><td>Every claim carries a source<div class="st-helper">cites the formula it describes</div></td>
       <td class="st-nowrap"><span class="st-tag st-tag--sm st-tag--green">passed</span></td></tr>
      </tbody></table></div>`)}</div>
   <div class="st-note st-note--warning"><div><b>Approved anyway, by d.xing at 09:38.</b>
    An advisory rule can be overridden and <b>the override is a permanent part of this row</b> &mdash;
    the disagreement is not cleared by approving past it. That is the whole difference between an
    advisory rule and a hard one.</div></div>`;
  return `<div class="st-section"><div class="st-section__head">
     <h3 class="st-heading-sm">What was proposed</h3></div>
    ${grp(`<dl class="st-kv"><dt>Change</dt><dd>PAY09 Pension Rate &mdash; description written</dd>
      <dt>Before</dt><dd class="st-text-secondary">no description</dd>
      <dt>After</dt><dd><span class="st-text-secondary">never generated</span></dd></dl>`)}</div>
   <div class="st-note st-note--error"><div><b>A hard rule stopped this at creation.</b>
    The proposal was never built and nothing was sent.
    <div style="margin-top:var(--st-space-04)">
     <div class="st-codeblock__head">The rule <span class="st-codeblock__meta">quoted</span></div>
     <pre class="st-codeblock">Content from PAY09 is restricted to Northgate Foods.
A description written here would be readable by
anyone with access to Meridian Retail.</pre></div>
    <div class="st-helper" style="margin-top:var(--st-space-03)"><b>The rule is quoted rather than
     summarised.</b> A blocked action you cannot read the reason for is indistinguishable from a
     bug, and the person blocked is usually the person who has to get it unblocked.</div></div></div>`;
}

function actPane() {
  const r = ACTS[S.panel]; if (!r) return null;
  return panel(r[1], `${E(r[0])} &middot; ${E(r[2])}`,
    `<dl class="st-kv"><dt>State</dt><dd><span class="st-tag st-tag--sm st-tag--${r[4]}">${E(r[3])}</span></dd>
      <dt>Acting identity</dt><dd>${E(r[2])}</dd></dl>
     ${R('activity.proposal-detail', stateIf('activity.proposal-detail', proposalDetail(S.panel)))}`,
    'activity.proposal-detail');
}
function activityBody() { return (
  R('activity.acknowledge', stateIf('activity.acknowledge', acknowledge(1)))
  + R('activity.sequence', stateIf('activity.sequence', activitySequence(0)))
  + R('activity.branch-list', stateIf('activity.branch-list', branchList(0)))); }

V.activity = () => page('History of changes',
  'What happened, who did it, and whether anything is waiting on you.',
  withPane(activityBody(), S.panel != null ? actPane() : null));

/* ---------------- settings ----------------
   Four regions, 12 states. Every value here changes something a user will later
   see and have to explain, so every state says what it costs rather than only
   what it is. A budget that only shows its number is a number; a budget that
   says what happens when it runs out is a setting. */
function budgets(k) {
  const D = {
   0:['40,000','3','', `1,240 spent this month. Over budget, work <b>degrades rather than truncating</b> &mdash;
      an item becomes a question instead of being skipped silently.`],
   1:['40,000','87','st-meter--warn', `<b>34,900 of 40,000 spent, and it is the 12th.</b>
      At this rate the budget runs out around the 15th. Nothing is blocked and nothing is throttled
      &mdash; this is a heads-up, because the thing that changes at the limit is the quality of what
      you get, and that is worth knowing before it happens rather than after.`],
   2:['40,000','100','st-meter--warn', `<b>Exhausted.</b> Drafting has degraded: elements that
      would have got a machine description are now raised as questions instead.
      <b>Nothing is skipped and nothing is half-written</b> &mdash; every element is either fully
      described or visibly waiting for a person. The alternative, truncating, produces text that
      reads finished and is not.`]}[k];
  return `<div class="st-section"><div class="st-section__head"><h2 class="st-heading-sm">Budgets</h2>
    ${k === 2 ? '<span class="st-tag st-tag--sm st-tag--amber">exhausted</span>' : ''}</div>
   <div class="st-formitem"><label class="st-lbl" for="st-bud">Monthly token budget</label>
    <input class="st-field" id="st-bud" value="${D[0]}" inputmode="numeric">
    <div class="st-meter ${D[2]}" role="progressbar" aria-valuenow="${D[1]}" aria-valuemin="0"
         aria-valuemax="100" aria-label="Budget spent"><i style="width:${D[1]}%"></i></div>
    <div class="st-helper">${D[3]}</div></div>
   ${k === 2 ? `<div class="st-note st-note--warning" style="margin-top:var(--st-space-05)"><div>
     <b>247 elements are waiting as questions that would otherwise have been drafted.</b> Raising
     the budget does not retroactively draft them &mdash; the next run picks them up.</div></div>` : ''}
   </div>`;
}

function extractionLimits(k) {
  const warn = k === 1, dirty = k === 2;
  return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Extraction limits</h2>
    ${dirty ? '<span class="st-tag st-tag--sm st-tag--amber">unsaved</span>' : ''}</div>
   <div class="st-grid">
    <div class="st-col st-col--half"><div class="st-formitem st-formitem--full">
     <label class="st-lbl" for="st-cap">List member cap</label>
     <input class="st-field${warn ? ' st-field--strong' : ''}" id="st-cap" value="${warn ? '40,000' : dirty ? '80,000' : '50,000'}" inputmode="numeric">
     <div class="st-helper">${warn
       ? `<b>One list in WFP has 68,402 members and another has 52,110.</b> At 40,000 both would be
          read in part, where today one is. <b>Lowering a cap does not shrink a list</b> &mdash; it
          moves the line between what is read and what is declared missing.`
       : `One list in WFP has 68,402 members. Below that figure it is read in part, and the gap is
          declared in every answer that touches it.`}</div></div></div>
    <div class="st-col st-col--half"><div class="st-formitem st-formitem--full">
     <label class="st-lbl" for="st-scale">Scale warning threshold</label>
     <input class="st-field" id="st-scale" value="${dirty ? '400 modules' : '250 modules'}">
     <div class="st-helper">Above this, adding a model warns you first.</div></div></div></div>
   ${warn ? `<div class="st-note st-note--warning" style="margin-top:var(--st-space-05)"><div>
     <b>This value is below what your current models need.</b> You can still set it &mdash; the
     warning exists so the consequence is visible now rather than in an answer three weeks from
     now that quietly says part of a list was not read.</div></div>` : ''}
   ${dirty ? `<div class="st-btn-group" style="margin-top:var(--st-space-05)">
     <button class="st-btn st-btn--primary st-btn--sm">Save</button>
     <button class="st-btn st-btn--tertiary st-btn--sm">Discard</button>
     <span class="st-helper"><b>Neither value applies until the next read.</b> Changing a cap does
      not re-read anything that has already been read.</span></div>` : ''}
   </div>`;
}

function pollInterval(k) {
  return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Checking for changes</h2></div>
   <div class="st-formitem"><label class="st-lbl" for="st-poll">Interval</label>
    <select class="st-field" id="st-poll">
     <option${k === 0 ? ' selected' : ''}>Off &mdash; the default</option>
     <option${k > 0 ? ' selected' : ''}>Every 15 minutes</option>
     <option>Every hour</option></select>
    <div class="st-helper">${{
      0:`<b>Off by default</b>, and that is a decision rather than an oversight: a check that runs
         on its own costs money on its own, and this product would rather you asked.`,
      1:`<b>On, every 15 minutes.</b> Roughly 96 checks a day. Each is a metadata request, not a
         read &mdash; about 40 tokens, so under 4,000 a month against your 40,000.`,
      2:`<b>This is a cheap metadata check, not a re-read.</b> It can tell you Anaplan has changed;
         it cannot tell you what changed, and it never updates the store. The banner that says
         &ldquo;checked under a minute ago&rdquo; means checked, not re-read &mdash; and those are
         different enough that saying the wrong one would be a lie about how current your answers
         are.`}[k]}</div></div></div>`;
}

function serializerFlip(k) {
  const flipped = k > 0;
  return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Store format</h2>
    <span class="st-tag st-tag--sm st-tag--${flipped ? 'amber' : 'green'}">${
      k === 1 ? 'JSON &middot; unsaved' : k === 2 ? 'JSON &middot; in use' : 'YAML &middot; in use'}</span></div>
   ${grp(
    `<div class="st-helper">What the agent is sent. The format on disk is a separate thing and is
      not configurable &mdash; this setting binds the wire, not the store.</div>`,
    `<dl class="st-kv">
      <dt>In use</dt><dd>${flipped ? 'JSON for everything the agent receives'
        : 'YAML for everything the agent receives, tables included'}</dd>
      <dt>Fallback</dt><dd>${flipped ? 'YAML, in one serializer change' : 'JSON, in one serializer change'}</dd>
      <dt>Parse errors</dt><dd class="st-num">${k === 2 ? '0.61%' : '0.08%'} of payloads served this month</dd></dl>`,
    k === 1
     ? `<div class="st-note st-note--warning"><div><b>Flipped to JSON, not yet saved.</b>
        Saving changes what every future payload looks like. <b>Payloads already sent are not
        rewritten</b> &mdash; a trail entry from last week still shows the YAML the agent actually
        received, because a record that changes format retroactively is not a record.</div></div>`
     : k === 2
     ? `<div class="st-note st-note--warning"><div><b>Flipped, and here is why the fallback exists.</b>
        Parse errors reached 0.61%, above the 0.5% threshold. One format everywhere is easier for
        an agent to read than two &mdash; but <b>a format it cannot parse is worse than either</b>,
        and a rate that low is invisible in any single answer while being very visible across a
        thousand. The threshold is the point at which "occasionally wrong" becomes "systematically
        unreliable", and it is yours to move.</div></div>`
     : `<div class="st-formitem"><label class="st-lbl" for="st-thresh">Flip automatically above</label>
        <input class="st-field" id="st-thresh" value="0.5%" inputmode="decimal">
        <div class="st-meter" role="progressbar" aria-valuenow="16" aria-valuemin="0" aria-valuemax="100"
             aria-label="Parse error rate against the threshold"><i style="width:16%"></i></div>
        <div class="st-helper">The reason the fallback exists: one format everywhere is easier for
         the agent to read than two, but a format it cannot parse is worse than either.
         <b>Above this rate the whole wire flips to JSON.</b> A trigger nobody can pull is not a
         fallback, so the threshold is yours to set.</div></div>`,
    `<div class="st-btn-group"><button class="st-btn st-btn--${k === 1 ? 'primary' : 'tertiary'} st-btn--sm">${
      k === 1 ? 'Save the flip' : k === 2 ? 'Flip back to YAML' : 'Flip to JSON now'}</button>
      <span class="st-helper">${k === 1 ? 'Nothing has changed yet.' : 'Unsaved changes are shown before anything applies.'}</span></div>`)}</div>`;
}

V.settings = () => page('Settings', 'How this machine is configured, and what changes if you alter it.',
  R('settings.budgets',             stateIf('settings.budgets', budgets(0)))
  + R('settings.extraction-limits', stateIf('settings.extraction-limits', extractionLimits(0)))
  + R('settings.poll-interval',     stateIf('settings.poll-interval', pollInterval(0)))
  + R('settings.serializer-flip',   stateIf('settings.serializer-flip', serializerFlip(0))));

/* ---------------- all contents ----------------
   `.st-pager` is the system's now — adopted 6 Sep from this artefact's own

     <b>${N(o.from)}&ndash;${N(o.to)}</b>

    </p>
    <div class="st-pager__size">
     <label class="st-lbl" for="pg-size">Per page</label>
     <select class="st-field" id="pg-size"><option>5</option><option>25</option><option>100</option></select>
    </div>
    <div class="st-pager__nav">
     <button class="st-btn st-btn--tertiary st-btn--sm" type="button">Next &rsaquo;</button>
    </div>
   </div>`;
}

V.contents = () => page('Everything in this model',
  'Every kind as a sortable table, so a whole kind can be scanned and compared at once. The same rows, the same panel — a second door, not a second source.',
  R('contents.table', grp(
    `<div class="st-tablist" role="tablist">
      ${[['module','Modules',312],['line_item','Line items',11847],['list','Lists',41],
         ['list_member','List members',68402],['view','Views',184],['action','Actions',62],
         ['area','Business areas',14]].map((t, i) =>
        `<button class="st-tab" role="tab" aria-selected="${i === 0}">${t[1]}
          <span class="st-num st-text-secondary">${N(t[2])}</span></button>`).join('')}
     </div>`,
    `<div class="st-grid">
      <div class="st-col st-col--half"><div class="st-search"><label class="st-search__field">
        <span class="st-search__icon" aria-hidden="true">&#9906;</span>
        <input class="st-field" type="search" placeholder="Search 312 modules" aria-label="Search modules">
        </label><div class="st-search__count" aria-live="polite"><b>5</b> of <b>312</b> match</div></div></div>

/* ============================================================
   The agent panel — F-5 resolved as option B, 23 August.

   Two different kinds of thing live here and the split is the point:

   THE WAY IN is design work and is built properly, on the system. Where the
   control sits, what it says before you press it, how the scope is declared,
   what happens when there is nothing to ask about, how it closes.

   THE CONVERSATION is not ours. It is determined by the system reading the
   store, and it is drawn as a marked sketch that deliberately does not meet the
   design system — because a polished render of an undecided interaction gets
   built. The sketch classes are `sk-`, never `st-`, so nothing here can be
   mistaken for a proposal that Strata should adopt it.

   NO REGION CODE. The entry point and this panel are new surfaces and the
   register has no code for either. Minting one is the register owner's act, not
   mine — a code invented here would look identical to a real one and would break
   the trace back to a requirement that does not exist.
   ============================================================ */
function askPanel() {
  const sc = askScope();
  if (!sc.ok) return panel('Ask', sc.full,
    `<div class="st-empty"><p class="st-empty__title">${E(sc.full)}</p>
      <div class="st-empty__body"><p class="st-body-sm">${sc.why}</p>
      <div class="st-btn-group">
       <button class="st-btn st-btn--tertiary st-btn--sm" data-go="registry">Choose a model</button></div></div></div>`,
    'app.detail');

  return panel(`Ask about ${E(sc.full)}`, `${E(sc.kind)} &middot; in ${E(sc.model)}`,
    grp(
     /* ---- ours: the scope contract, on the system ---- */
     `<div class="st-note"><div><b>Everything below is answered about
       ${E(sc.full)}</b> and nothing else. Move to another ${E(sc.kind)} and this panel follows you
       — it does not keep the old scope, because an answer arriving about something you have
       stopped looking at is the one failure this panel exists to prevent.</div></div>`,

     /* ---- not ours: the exchange, drawn as a sketch ---- */
     `<div class="sk-sketch">
       <span class="sk-label">sketch &middot; not the design system</span>
       <div class="sk-body">
        <div class="sk-turn sk-turn--you">
         <span class="sk-who">you</span>
         <p class="sk-text">What would break if I changed the uplift?</p></div>

        <div class="sk-turn sk-turn--them">
         <span class="sk-who">the layer</span>
         <p class="sk-text"><span class="sk-mark">Uplift %</span> feeds
          <span class="sk-mark">Salary Cost LC</span>, which reaches 141 things —
          2 of them are outputs. One element in the chain has no description.</p></div>

        <div class="sk-note">every underlined thing is a link into the model.<br>
         an answer with an unmarked claim is a defect.</div>

        <div class="sk-turn sk-turn--you">
         <span class="sk-who">you</span>
         <p class="sk-text">Write the missing one.</p></div>

        <div class="sk-turn sk-turn--them">
         <span class="sk-who">the layer</span>
         <p class="sk-text">Here is what it would put in Anaplan, before anything is sent.
          <br>&#8627; the real before-and-after card goes here, and it is built — see the
          reference sheet.</p></div>

        <div class="sk-note">nothing is written without an explicit approval<br>
         under a named identity. that part is not a sketch.</div>

        <div class="sk-composer">ask about ${E(sc.full)}&hellip;</div>
       </div>
      </div>`,

     /* ---- ours again: what is true regardless ---- */
     `<div class="st-helper"><b>Why this is a sketch.</b> How the exchange looks is determined by
       the agent reading the store, and that agent does not exist yet. What the sketch fixes is the
       <b>shape</b>: scoped to one thing, every claim marked, nothing written without approval.
       Those three are requirements. The boxes are not.</div>`,
     `<div class="st-btn-group">
       <button class="st-btn st-btn--tertiary st-btn--sm" data-go="chat">Open the reference sheet</button>
      </div>`,
     `<div class="st-helper">The reference sheet is the same exchange with every part marked
       <b>required</b> or <b>example</b> — it is what a developer builds from.</div>`),
    'app.detail');
}

   product, full-bleed. Everything here is on demand and painted
   never — data-review, deleted on build, hidden in print.

   It wears the system's own `.st-review` and `.st-review--bar` now. The
   previous revision hand-built a dark bar with its own button chrome, ~25 lines,
   for a surface the system already expresses. What is left in this file is the
   one thing the system cannot know: where a fixed overlay sits.
   ============================================================ */
const WORST = 'nobody has used this — construction being finished is not evidence that the design works';
const OPEN = [];

function reviewBar() {
  const total = Object.keys(REG).length;
  const btn = (t, on, label) =>
    `<button class="st-btn st-btn--${on ? 'secondary' : 'tertiary'} st-btn--sm"
       aria-pressed="${!!on}" data-t="${t}">${label}</button>`;
  const lvl = LEVELS.map(v => `<button class="st-btn st-btn--${LEVEL === v ? 'secondary' : 'tertiary'} st-btn--sm"
       aria-pressed="${LEVEL === v}" data-setlevel="${v}">${v}</button>`).join('');
  return `<span class="st-btn-group" role="group" aria-label="Fidelity level">${lvl}</span>
   <span class="st-helper st-nowrap">${total} regions &middot; all drawn &middot; none open</span>
   <span class="rsp st-helper">&#9888; ${E(WORST)}</span>
   ${btn('rgn', S.rgn, 'Regions')}
   ${btn('drawer', S.drawer, 'Product team review')}
   ${btn('theme', false, 'Theme')}`;
}

function regionPopover(code, x, y) {
  const r = REG[code];
  const el = document.getElementById('rpop');
  if (el) el.remove();
  if (!r) return;
  const d = document.createElement('div');
  d.id = 'rpop'; d.className = 'st-tile'; d.setAttribute('data-review', '');
  d.innerHTML = `<p class="st-label st-text-secondary" style="margin:0 0 4px">Region</p>
    <p class="st-body-sm" style="margin:0 0 var(--st-space-04)"><span class="st-code">${E(code)}</span></p>
    <dl class="st-kv"><dt>Pattern</dt><dd>${E(r[0])}</dd>
      <dt>Requirements</dt><dd>${E(r[2] || '—')}</dd>
      <dt>Drawn here</dt><dd>${DRAWN.has(code) ? 'yes' : '<b>not yet</b>'}</dd>
      <dt>States it can be in</dt><dd>${E(r[1] || '—')}</dd></dl>`;
  document.body.appendChild(d);
  const w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = Math.min(x, innerWidth - w - 12) + 'px';
  d.style.top = Math.min(y + 12, innerHeight - h - 12) + 'px';
}

/* ============================================================ motion ======= */
const WAS = { route:null, pane:null, panel:null, ask:null, done:0, cat:null,
              walkDir:null, walkMode:null, walkOpen:null, pathIx:null };

function motion() {
  if (!MOTION) return;
  const pg = document.querySelector('.st-page');
  const pane = document.querySelector('.st-shell__panel');
  if (pg && WAS.route !== S.route) pg.classList.add('st-page-enter');
  if (pane && (WAS.pane !== S.pane || WAS.panel !== S.panel || WAS.ask !== S.ask))
    pane.classList.add('st-enter');
  if (WAS.done !== S.done) {
    const el = document.querySelector('[data-region="queue.position-remaining"] .st-body-md');
    if (el) el.classList.add('st-settle');
  }
  if (WAS.walkDir !== S.walkDir || WAS.walkMode !== S.walkMode) {
    const w = document.querySelector('.st-lineage');
    if (w) w.classList.add('st-settle');
  }
  if (WAS.walkOpen !== S.walkOpen && S.walkOpen) {
    const n = document.querySelector('.st-lineage__node--open .st-lineage__nest');
    if (n) n.classList.add('st-enter');
  }
  if (WAS.pathIx !== S.pathIx) {
    const pth = document.querySelector('.st-lineage--path');
    if (pth) pth.classList.add('st-settle');
  }
  Object.assign(WAS, {route:S.route, pane:S.pane, panel:S.panel, ask:S.ask, done:S.done,
    cat:S.cat, walkDir:S.walkDir, walkMode:S.walkMode, walkOpen:S.walkOpen, pathIx:S.pathIx});
}

/* ============================================================ draw ========= */
function draw() {
  /* The tab title is the one piece of level-dependent text outside the review
     layer, and it drifted on the previous revision: the file said BOUND in its
     attribute and "Draft" in its title for two weeks. Derived rather than typed. */
  document.title = 'Anaplan Semantic Layer \u2014 ' + LEVEL[0] + LEVEL.slice(1).toLowerCase();
  const bar = document.getElementById('rbar');
  bar.innerHTML = reviewBar();

  const railHtml = rail();
  const bandHtml = band();
  PANE = null;
  const content = S.force === 'loading' ? loadingFor(S.route) : (V[S.route] || V.registry)();
  /* The agent panel outranks whatever the screen had open. It is the only pane the
     user asked for by name, so it takes the slot rather than stacking a second one
     — two panels side by side would make "which of these am I asking about" a live
     question, and that is the exact question this panel is scoped to answer. */
  if (S.ask) PANE = askPanel();

  /* The panel is a GRID SIBLING of main, which is what the system's
     `.st-shell:has(> .st-shell__panel[data-open="true"])` rule needs. The previous
     revision nested it inside main and paid for it in a reading-edge bug.
     `--st-shell-panel` is set here rather than patched in CSS: it is the knob the
     system publishes, and using it is not an override. */
  const shell = `<div class="st-shell ${railHtml ? 'st-shell--explorer' : 'st-shell--norail st-shell--task'}"
     data-appearance="table-head-tint" data-density="comfortable"
     style="--st-shell-panel:24rem">
    ${header()}${bandHtml}${railHtml}
    <main class="st-shell__main" id="main" tabindex="-1"><div class="st-fill">${content}</div></main>
    ${PANE || ''}
   </div>`;
  document.getElementById('app').innerHTML = shell;

  document.body.classList.toggle('rgn', S.rgn);
  let d = document.getElementById('rdrawer');
  if (S.drawer) {
    if (!d) { d = document.createElement('aside'); d.id = 'rdrawer'; d.setAttribute('data-review', ''); document.body.appendChild(d); }
    d.innerHTML = reviewDrawer();
  } else if (d) { d.remove(); }
  const p = document.getElementById('rpop'); if (p && !S.rgn) p.remove();
  motion();
}

/* ============================================================ events ======= */
document.addEventListener('click', ev => {
  const lv = ev.target.closest('[data-setlevel]');
  if (lv) { ev.preventDefault(); return setLevel(lv.dataset.setlevel); }

  const t = ev.target.closest('[data-t]');
  if (t) {
    ev.preventDefault();
    if (t.dataset.t === 'theme') {
      const r = document.documentElement;
      r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
      return draw();
    }
    S[t.dataset.t] = !S[t.dataset.t];
    return draw();
  }

  if (S.rgn) {
    const rg = ev.target.closest('[data-region]');
    if (rg) { ev.preventDefault(); return regionPopover(rg.dataset.region, ev.clientX, ev.clientY); }
  }

  const go = ev.target.closest('[data-go]');
  if (go) {
    ev.preventDefault();
    const d = go.dataset;
    if (d.model) S.model = d.model;
    if (d.cat) { S.cat = d.cat; S.panel = null; }
    if (d.mod) { S.anchor = d.mod; S.item = null; S.pane = null; S.panel = null; }
    if (d.unroot) S.anchor = null;
    if (d.li != null) { S.item = +d.li; S.pane = null; }
    S.route = d.go;
    if (d.go === 'model-home' && !d.mod) S.anchor = null;
    window.scrollTo(0, 0);
    return draw();
  }

  const pn = ev.target.closest('[data-panel]');
  if (pn && !ev.target.closest('[data-stop]')) {
    ev.preventDefault();
    S.panel = (S.panel === +pn.dataset.panel) ? null : +pn.dataset.panel; return draw();
  }

  if (ev.target.closest('[data-closepane]')) {
    ev.preventDefault();
    const pane = document.querySelector('.st-shell__panel');
    /* The guard is load-bearing and only matters at MOTION. Two things race to
       close this panel — `animationend` at 110ms, and a 200ms timeout that exists
       so a missed event cannot strand the state — and BOTH used to fire. The
       second one lands 90ms after the panel is already gone, so if you dismissed
       a panel and opened another inside that window, the stray call closed the
       new one. Measured: dismiss, wait 140ms, open the ask panel, and it shuts by
       itself 60ms later. Invisible at DRAFT and BOUND, because the early return
       above means neither timer is ever set. */
    let done = false;
    const close = () => { if (done) return; done = true;
      S.ask = false; S.panel = null; S.pane = null;
      WAS.pane = null; WAS.panel = null; WAS.ask = null; draw(); };
    if (!MOTION || !pane) return close();
    /* Leaving is faster than arriving — a departure that lingers reads as
       hesitation. The removal waits for it, so the panel is not simply cut. */
    pane.classList.add('st-exit');
    pane.addEventListener('animationend', close, {once:true});
    setTimeout(close, 200);          // never strand the state on a missed event
    return;
  }

  const sf = ev.target.closest('[data-setfilter]');
  if (sf) { ev.preventDefault(); S.areaFilter = sf.dataset.setfilter; S.panel = null; return draw(); }
  if (ev.target.closest('[data-clearfilter]')) { ev.preventDefault(); S.areaFilter = null; return draw(); }

  /* changes the subject -> the centre */
  const it = ev.target.closest('[data-item]');
  if (it) { ev.preventDefault(); S.item = +it.dataset.item; S.pane = null; S.panel = null;
    window.scrollTo(0, 0); return draw(); }

  /* reveals more about the subject -> the panel */
  const pn2 = ev.target.closest('[data-pane]');
  if (pn2) { ev.preventDefault();
    S.pane = S.pane === pn2.dataset.pane ? null : pn2.dataset.pane; return draw(); }

  const vr = ev.target.closest('[data-ver]');
  if (vr) { ev.preventDefault(); S.verOpen = S.verOpen === vr.dataset.ver ? null : vr.dataset.ver; return draw(); }

  const wd = ev.target.closest('[data-walkdir]');
  if (wd) { ev.preventDefault(); S.pane = wd.dataset.walkdir === 'up' ? 'walk-up' : 'walk-down';
    S.walkDir = wd.dataset.walkdir; S.st = {}; return draw(); }

  const wm = ev.target.closest('[data-walkmode]');
  if (wm) { ev.preventDefault(); S.walkMode = wm.dataset.walkmode; return draw(); }

  const wk = ev.target.closest('[data-walk]');
  if (wk) { ev.preventDefault(); S.walkOpen = S.walkOpen === wk.dataset.walk ? null : wk.dataset.walk; return draw(); }

  const stp = ev.target.closest('[data-step]');
  if (stp) { ev.preventDefault(); S.step = +stp.dataset.step; return draw(); }

  const stb = ev.target.closest('[data-st]');
  if (stb) { ev.preventDefault(); S.st = Object.assign({}, S.st, {[stb.dataset.st]: +stb.dataset.sti});
    return draw(); }

  const fc = ev.target.closest('[data-force]');
  if (fc) { ev.preventDefault(); S.force = fc.dataset.force || null; return draw(); }

  const ans = ev.target.closest('[data-answer]');
  if (ans) { ev.preventDefault(); S.done++; S.panel = null; return draw(); }
});

document.addEventListener('change', ev => {
  if (ev.target.hasAttribute && ev.target.hasAttribute('data-path')) { S.pathIx = +ev.target.value; return draw(); }
  const sel = ev.target.closest('[data-sel]');
  if (sel) { const i = +sel.dataset.sel;
    S.sel = sel.checked ? S.sel.concat(i) : S.sel.filter(x => x !== i); return draw(); }
  if (ev.target.id === 'wb-mean') { S.dirty = true; return draw(); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'wb-mean' && !S.dirty) { S.dirty = true; draw(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const p = document.getElementById('rpop'); if (p) { p.remove(); return; }
    if (S.drawer) { S.drawer = false; draw(); }
  }
});
/* The ask control's label is hidden below 1280 because the header has no room to
   spare, so a resize has to re-render it rather than leave the wrong one drawn. */
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(draw, 120); });

draw();

</script>
</body>
</html>
