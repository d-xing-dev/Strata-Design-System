   TEXT with no hops behind it, so it passed every review that scanned for the
   requirement's vocabulary. It stood eighteen days. See the governing rule in
   PATTERNS.md -- a staged view must state what it staged, in the component.

   Distance is the organising principle, not an inference from indentation
   depth. Each hop is a real <section> with a real heading, so a screen-reader
   user gets "Hop 2, 7 items" as a landmark; the nodes are a <ul>, so the count
   is announced; expansion is a <button>, so it is keyboard-operable. That is
   also the argument against the node-link canvas this category reaches for
   first: a canvas has no linear reading order, cannot be pasted into a message
   and cannot be cited inside a chat answer. Legitimate second view, poor only
   view.

   DECLARED ABSENCE reuses the expression the system already had. `.st-empty`
   states a hole with `1px dashed border-strong-01`, and `.st-empty--error`
   separates failure by going SOLID in `support-error`. A restricted node and
   the horizon band are both stated holes, so they wear the dashed edge and are
   structurally incapable of reading as an error. They share it with each other
   because they are the same semantic, which is what the shared-expression rule
   permits -- it forbids two DIFFERENT patterns wearing one costume.

   No new token, no new colour, no new value. Nothing here goes near the role
   wheel, so `check_role_separation()` is untouched by construction.
   ========================================================================== */
.st-lineage { display: flex; flex-direction: column; position: relative; }
/* The origin is the one element the whole walk is relative to, so it never
   scrolls away. It sticks to whichever ancestor scrolls: constrain the height
   here and it sticks within the walk, leave it and it sticks to the page. */
.st-lineage__origin { position: sticky; top: 0; z-index: 1;
                      display: flex; flex-wrap: wrap; align-items: center;
                      gap: var(--st-space-03);
                      padding: var(--st-space-04) var(--st-space-05);
                      background: var(--st-layer-01);
                      border: 1px solid var(--st-border-subtle-00);
                      border-radius: var(--st-radius-lg);
                      margin-bottom: var(--st-space-04); }

/* One distance band. The heading is not decoration -- it is how distance is
   announced to anyone not reading indentation. */
.st-lineage__hop { padding-block: var(--st-space-04);
                   border-top: 1px solid var(--st-border-subtle-01); }
.st-lineage__hop:first-of-type { border-top: 0; padding-top: 0; }
.st-lineage__hoplabel { display: flex; align-items: baseline; gap: var(--st-space-02);
                        margin: 0 0 var(--st-space-02);
                        font: var(--st-type-label-weight) var(--st-type-label-size)/var(--st-type-label-lh) var(--st-font-sans);
                        letter-spacing: var(--st-type-label-ls); text-transform: uppercase;
                        color: var(--st-text-secondary); }
/* Direction is a property of the WALK, not of each node, so the cue sits on the
   band once rather than repeating on every row. The caret is a second channel
   and never the only one: `__origin` must state the direction in words. */
.st-lineage__hoplabel::before { content: ""; flex: none; align-self: center;
                                width: 0; height: 0;
                                border-top: 3px solid transparent;
                                border-bottom: 3px solid transparent;
                                border-left: 4px solid var(--st-icon-secondary);
                                transform: var(--st-lineage-dir, none); }
.st-lineage--upstream { --st-lineage-dir: scaleX(-1); }
.st-lineage--downstream { --st-lineage-dir: none; }
/* The count is part of the band, not helper text beside it. */
/* The band's gap is tight so the direction caret reads as part of the label. The
   count needs its own air or "Hop 1" and "2 items" run together into "HOP 12 ITEMS",
   which is how a count stops being readable as a count. */
.st-lineage__hopcount { margin-inline-start: var(--st-space-03);
                        font-variant-numeric: tabular-nums; color: var(--st-text-helper);
                        text-transform: none; letter-spacing: 0;
                        font-size: var(--st-type-helper-size); font-weight: 400; }

.st-lineage__nodes { list-style: none; margin: 0; padding: 0;
                     display: flex; flex-direction: column; }
.st-lineage__node { display: flex; flex-wrap: wrap; align-items: baseline;
                    gap: var(--st-space-03);
                    padding: var(--st-space-02) var(--st-space-04);
                    margin-inline-start: var(--st-space-05);
                    border-radius: var(--st-radius-sm);
                    font-size: var(--st-type-body-sm-size); }
.st-lineage__node:hover { background: var(--st-layer-hover-01); }
/* `.st-code` sets font and never colour or decoration, so `a.st-code` kept the UA
   underline and the walk carried a SECOND link expression beside `.st-link`'s. Match
   `.st-link` exactly. Noted as a system-wide gap: `a.st-code` has no defined
   expression anywhere. First occurrence, so it gets a local fix and a finding. */
.st-lineage__node a { color: var(--st-link-primary); text-decoration: none; }
.st-lineage__node a:hover { text-decoration: underline; text-underline-offset: 2px; }
.st-lineage__node a:focus-visible { outline: 2px solid var(--st-focus); outline-offset: 1px;
                                    border-radius: var(--st-radius-xs); }
/* The description is what makes the chain MEANINGFUL rather than structural, so
   it is never truncated. Above md it shares the row; below it takes its own line
   and wraps. `.st-truncate` on this element is a defect, not a density choice. */
.st-lineage__desc { color: var(--st-text-secondary); min-width: 0;
                    flex: 1 1 100%; overflow-wrap: anywhere; }
@media (min-width: 672px) { .st-lineage__desc { flex: 1 1 auto; } }

.st-lineage__node-toggle { flex: none; display: inline-flex; align-items: center;
                           justify-content: center; padding: 0; border: 0;
                           background: none; cursor: pointer;
                           color: var(--st-icon-secondary); }
.st-lineage__node-toggle svg { width: 14px; height: 14px;
                               transition: transform var(--st-duration-fast) var(--st-ease-standard); }
.st-lineage__node-toggle:focus-visible { outline: 2px solid var(--st-focus); outline-offset: 2px;
                                         border-radius: var(--st-radius-xs); }
.st-lineage__node--open > .st-lineage__node-toggle svg { transform: rotate(90deg); }
/* Children reveal UNDER the node. The walk above and below stays exactly where
   it was, because opening one node must not cost you your place in the walk. */
.st-lineage__nest { flex: 1 1 100%; margin: var(--st-space-03) 0 var(--st-space-02);
                    padding-inline-start: var(--st-space-05);
                    border-inline-start: 1px solid var(--st-border-subtle-01); }

/* A declared hole. The reference stays visible and the content is withheld, and
   the dashed border-strong edge is the same expression `.st-empty` uses -- which
   is precisely how it stays distinguishable from an error, since errors go SOLID
   in support-error. The words must say it too; the edge is the second channel. */
.st-lineage__node--restricted { border: 1px dashed var(--st-border-strong-01);
                                border-radius: var(--st-radius-sm); }
.st-lineage__node--restricted:hover { background: none; }
.st-lineage__node--restricted .st-lineage__desc { color: var(--st-text-helper); }

/* Within-band overflow. A band shows its first few and STATES the rest; it never
   silently truncates, and the same row carries an extreme fan-out cut. */
.st-lineage__more { margin-top: var(--st-space-03);
                    margin-inline-start: var(--st-space-05); }
/* The horizon is a band in its own right, not a footnote, because the chain
   always exists and only the view is staged. */
.st-lineage__horizon { margin-top: var(--st-space-04);
                       margin-inline-start: var(--st-space-05);
                       padding: var(--st-space-04);
                       border: 1px dashed var(--st-border-strong-01);
                       border-radius: var(--st-radius-sm);
                       display: flex; flex-direction: column; align-items: flex-start;
                       gap: var(--st-space-03); }
/* The horizon has no direction of its own -- it is where direction runs out. */
.st-lineage__horizon .st-lineage__hoplabel { margin: 0; }
.st-lineage__horizon .st-lineage__hoplabel::before { content: none; }

/* --------------------------------------------------------------------------
   Lineage: the PATH variant

   Added 6 Sep 2026, adopted from an engagement proposal (CP-02b). A VARIANT and not a
   new component, because it is the same walk over the same graph -- only the question
   changes.

   The hop bands above answer "what is one step away, and how far does this reach". This
   answers "how does this number get MADE": one route, end to end, with the formula at
   every step and how the value enters the next one. A dependency trace says what is
   connected; a calculation trace says how the value gets through, and that is what
   somebody needs in front of them before they change a formula.

   Why not `.st-steps`, which is the nearest fit and was tested against this. A stepper
   and a route have the same shape and incompatible meanings: a stepper encodes YOUR
   PROGRESS THROUGH A TASK -- done, current, unreachable, failed -- and a route encodes
   A VALUE'S PASSAGE THROUGH FORMULAS, where every node is equally "done" and none is
   current. Wearing the stepper would inherit revisit-and-progress semantics that are
   false here, which is the same argument that kept steps and tabs apart.

   Both ends are marked because both are findings. Downstream a route ends at an output
   nothing consumes; upstream it ends at an input nothing feeds. Neither is an empty
   list -- each is where the chain genuinely stops.
   -------------------------------------------------------------------------- */
.st-lineage--path .st-lineage__nodes { padding-inline-start: 0; }
.st-lineage__step { position: relative;
                    padding: var(--st-space-04) 0 var(--st-space-04) var(--st-space-06); }
/* The spine is drawn on the step rather than the list, so it can stop half way at each
   end -- a line running past the first and last node implies a chain that continues,
   which is the one thing a terminal must not say. */
.st-lineage__step::before { content: ""; position: absolute; inset-inline-start: 5px;
                            top: 0; bottom: 0; width: 2px;
                            background: var(--st-border-subtle-01); }
.st-lineage__step:first-child::before { top: 50%; }
.st-lineage__step:last-child::before  { bottom: 50%; }
.st-lineage__step::after { content: ""; position: absolute; inset-inline-start: 0;
                           top: calc(var(--st-space-04) + 0.4em);
                           width: 12px; height: 12px; border-radius: var(--st-radius-full);
                           background: var(--st-layer-02);
                           border: 2px solid var(--st-border-strong-01); }
/* Where the value enters the next formula. Named, because "connected to" and "summed
   into" are different facts and only one of them explains a number. */
.st-lineage__via { display: block; margin-inline-start: var(--st-space-06);
                   font-size: var(--st-type-helper-size); color: var(--st-text-helper); }
/* The formula the value passes through, verbatim. */
.st-lineage__rule { display: block; margin-top: var(--st-space-02);
                    font: var(--st-type-code-size)/var(--st-type-code-lh) var(--st-font-mono);
                    color: var(--st-text-secondary);
                    white-space: pre-wrap; overflow-wrap: anywhere; }
/* The end of the road in either direction. The marker is a second channel only -- the
   step must say "final output" or "source" in words as well. */
.st-lineage__step--terminal::after { background: var(--st-border-interactive);
                                     border-color: var(--st-border-interactive); }
.st-lineage__step--origin::after { background: var(--st-text-primary);
                                   border-color: var(--st-text-primary); }

/* ==========================================================================
   Steps — `navigation-set`, stepper form

   Extracted from Carbon's ProgressIndicator. States map 1:1 (complete, current,
   incomplete, invalid), with one recorded divergence: `--failed` is not optional.
   Sequences fail, and a stepper with no failure state forces a fallback that
   undoes the component.

   Built separately from `.st-tablist` on purpose. Tabs are peers in no order that
   you may revisit freely; steps have an order, a current position, and things you
   cannot yet reach. A modifier would inherit the wrong revisit semantics.
   ========================================================================== */
/* [encode 2026-08-20, ledger E-13] Border-top state coding replaces the boxed
   stepper: each step is a 2px leading edge + text, state carried by edge colour
   AND weight (survives greyscale). The number circles retire; position is still
   stated in text via __pos, which is the accessible channel the circles never
   were. __num is display:none rather than deleted so existing markup renders
   clean while it is migrated out. --failed remains non-optional. */
.st-steps { display: flex; gap: var(--st-space-02); list-style: none;
            margin: 0; padding: 0; }
.st-step { flex: 1; display: block; padding: var(--st-space-03) var(--st-space-02) 0 var(--st-space-03);
           border-top: 2px solid var(--st-border-subtle-01);
           font-size: var(--st-type-body-sm-size); color: var(--st-text-secondary);
           min-width: 0; background: none; }
.st-step__num { display: none; }
.st-step__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
/* Position stated in text, not implied by the drawing. Not decoration. */
.st-step__pos { display: block; font-size: var(--st-type-helper-size); color: var(--st-text-helper); }
.st-step--done { border-top-color: var(--st-border-inverse); color: var(--st-text-primary); }
/* --current carries colour AND weight, so it survives greyscale. */
.st-step--current { border-top-color: var(--st-border-interactive); color: var(--st-text-primary); }
.st-step--current .st-step__text { font-weight: 600; }
.st-step--todo { color: var(--st-text-secondary); }
.st-step--failed { border-top-color: var(--st-support-error); }
.st-step--failed .st-step__text { color: var(--st-text-error); font-weight: 600; }

/* ==========================================================================
   Stat — `summary-tile`

   Added. Carbon has no metric component; only the meter maps to anything
   (Progress bar). A single number a person reads before anything else, with the
   one word that says what it counts. Used in rows of two to four.

   [encode 2026-08-20, ledger E-14] REVERSAL: the stat IS a card now. The
   original "no border of its own" rule assumed a tonal canvas doing the
   separating; on the locked white canvas a bare figure floats. The stat card is
   the display moment of the language: hairline card, caps label, 28/600 figure.
   The row-of-four-panels risk the old rule guarded against is handled by the
   composition layer's gap hierarchy instead.
   ========================================================================== */
.st-stat { display: flex; flex-direction: column; gap: var(--st-space-02); min-width: 0;
           padding: var(--st-space-05); background: var(--st-layer-02);
           border: 1px solid var(--st-border-subtle-00); border-radius: var(--st-radius-xl);
           box-shadow: var(--st-elevation-01); }
.st-stat__figure { font: var(--st-type-display-weight) var(--st-type-display-size)/1.1 var(--st-font-sans);
                   letter-spacing: var(--st-type-display-ls); font-variant-numeric: tabular-nums;
                   color: var(--st-text-primary); display: flex; align-items: baseline; gap: var(--st-space-03); }
/* The label is REQUIRED and is not a tooltip. A bare figure is not information. */
.st-stat__label { font: var(--st-type-label-weight) var(--st-type-label-size)/var(--st-type-label-lh) var(--st-font-sans);
                  letter-spacing: var(--st-type-label-ls); text-transform: uppercase;
                  color: var(--st-text-secondary); }
.st-stat--lead .st-stat__label { color: var(--st-text-primary); font-weight: 600; }
/* Direction must survive greyscale: the sign is prepended in CSS content, so it
   is never carried by colour alone. On a green brand the up-is-green convention
   would otherwise collide with the primary action colour. */
.st-stat__delta { font-size: var(--st-type-label-size); font-weight: 600;
                  padding: 1px var(--st-space-03); border-radius: var(--st-radius-full);
                  white-space: nowrap; font-variant-numeric: tabular-nums; }
.st-stat__delta--up { background: var(--st-support-success-subtle); color: var(--st-support-success); }
.st-stat__delta--up::before { content: "+ "; }
.st-stat__delta--down { background: var(--st-support-error-subtle); color: var(--st-text-error); }
.st-stat__delta--down::before { content: "\2212 "; }
/* [6 Sep 2026] The meter was only ever a PART of the stat, and one engagement put it
   outside a stat three times -- a queue position, a bulk-apply progress row, a budget
   spend bar. Third occurrence, so it becomes an element in its own right, and the stat's
   part JOINS the selector rather than repeating the declarations. That is the same rule
   `.st-visually-hidden` follows, and it is what stops the two drifting apart.
   The stat keeps ONLY the top margin, because that margin is about sitting under a
   figure and means nothing standalone.
   A standalone meter carries no label of its own, so it must either sit inside a
   `role="progressbar"` with aria-valuenow/min/max, or be named by adjacent text. A bare
   bar is a picture of a number, and a picture of a number is not information. */
.st-meter, .st-stat__meter { height: 6px; border-radius: var(--st-radius-full);
                  background: var(--st-layer-accent-01); overflow: hidden; }
.st-stat__meter { margin-top: var(--st-space-03); }
/* border-interactive, not background-brand: the brand fill drops to 2.13:1 on the
   track in dark theme. This is the same hue family and clears 3:1 in both. */
.st-meter > i, .st-stat__meter > i { display: block; height: 100%; background: var(--st-border-interactive);
                      transition: width var(--st-duration-slow) var(--st-ease-standard); }
.st-meter--warn > i, .st-stat__meter--warn > i { background: var(--st-support-warning); }
/* A missing figure must never look like a zero. */
.st-stat--unavailable .st-stat__figure { color: var(--st-text-secondary); font-weight: 400;
                                         font-size: var(--st-type-heading-md-size); font-style: italic; }

/* ==========================================================================
   Comparison — tabular

   Added. Cell modifiers rather than a component, deliberately: the surrounding
   `.st-table` already carries sorting, zebra striping and row height, and a
   component would have to re-implement all three to sit inside it.
   ========================================================================== */
.st-cmp-before { color: var(--st-text-secondary); font-variant-numeric: tabular-nums; }
.st-cmp-after  { font-weight: 600; font-variant-numeric: tabular-nums; }
/* One delta treatment across the system, not two. */
.st-cmp-after .st-stat__delta { margin-inline-start: var(--st-space-03); }
/* An unchanged row RENDERS. A proposal that touches nothing must be able to say
   so; hiding it makes "no change" and "not included" look identical. */
.st-cmp-same { color: var(--st-text-secondary); font-style: italic; }
/* A live before-value can fail to fetch, and a blank cell reads as zero. */
.st-cmp-unread { color: var(--st-text-secondary); }
.st-cmp-unread::after { content: " \2014 could not be read"; font-size: var(--st-type-helper-size); }

/* ==========================================================================
   Comparison — prose

   Added. Two whole versions of the same content where a person must pick one.
   The attribution line is what makes it a comparison rather than two cards:
   who wrote it, when, and against which version.
   ========================================================================== */
.st-compare { display: grid; grid-template-columns: 1fr 1fr; gap: var(--st-space-05); align-items: stretch; }
@media (max-width: 820px) { .st-compare { grid-template-columns: 1fr; } }
.st-compare__panel { display: flex; flex-direction: column; padding: var(--st-space-05);
                     background: var(--st-layer-02); border: 1px solid var(--st-border-subtle-01);
                     border-radius: var(--st-radius-lg); }
/* The winning panel carries a TEXT TAG as well as a border. A border alone is a
   colour-only signal, and on a green brand it is the same green as success. */
.st-compare__panel--winning { border-color: var(--st-border-interactive);
                              box-shadow: inset 3px 0 0 var(--st-border-interactive); }
.st-compare__label { display: flex; align-items: center; gap: var(--st-space-03); font-weight: 600;
                     margin-bottom: var(--st-space-03); }
/* flex:1 so both panels end level regardless of text length. Ragged bottoms make
   two panels read as unrelated. */
.st-compare__body { flex: 1; margin: 0; }
.st-compare__attrib { margin: var(--st-space-05) 0 0; padding-top: var(--st-space-04);
                      border-top: 1px solid var(--st-border-subtle-01);
                      font-size: var(--st-type-helper-size); color: var(--st-text-secondary); }
/* A stated absence -- "the other person deleted this" -- not a blank. You cannot
   compare against an empty panel. */
.st-compare__panel--absent .st-compare__body { display: flex; align-items: center; justify-content: center;
                                               text-align: center; min-height: 64px;
                                               border: 1px dashed var(--st-border-strong-01);
                                               border-radius: var(--st-radius-sm);
                                               color: var(--st-text-secondary);
                                               font-size: var(--st-type-helper-size); padding: var(--st-space-05); }


/* ==========================================================================
   The default anchor

   [brief 6, 2026-08-23] There was no base `a` rule in this file. The comment
   below asserted that an unstyled <a> takes `--st-link-primary`; E-19's comment
   thirty lines further down recorded the opposite, that a bare content link
   "took the UA default, which fails contrast in dark theme". Both could not be
   true. E-19 was the correct one: a bare <a> rendered `#0000EE`, the only
   saturated blue anywhere in the system.

   E-19 answered it with a class, which fixes the REMEMBERED case and leaves the
   unremembered one exactly as it was. This rule is the other half, and it is
   what makes the comment below true rather than aspirational.

   Colour is set on every anchor: every classed anchor component in the system
   already sets its own colour, so each overrides this on specificity. The
   underline, hover and focus ring are scoped to `a:not([class])`, because
   `.st-btn` sets no text-decoration and an `a.st-btn` must not grow one.
   ========================================================================== */
a { color: var(--st-link-primary); }
a:not([class]) { text-decoration: underline; text-underline-offset: 2px; }
a:not([class]):hover { color: var(--st-link-hover); }
a:not([class]):focus-visible { outline: 2px solid var(--st-focus); outline-offset: 1px;
                               border-radius: var(--st-radius-xs); }

/* [6 Sep 2026] `.st-code` sets a font and never a colour or a decoration, so an anchor
   wearing it kept the UA underline and the system carried a SECOND link expression
   beside `.st-link`'s. It was fixed inside `.st-lineage` on 23 August and recorded there
   as occurrence one; an engagement has since used `a.st-code` in table cells, in
   breadcrumbs and in answer text, which makes it four. Four is a rule.
   It lives HERE, in the default-anchor section, and not in Content link thirty lines
   below -- because "Links inside semantic surfaces" comes between the two, carries equal
   specificity, and must win. Written below it, an identifier link inside a BLOCKED
   status would render in the action hue: the go colour inside a stop message. */
a.st-code { color: var(--st-link-primary); text-decoration: none; }
a.st-code:hover { text-decoration: underline; text-underline-offset: 2px; }
a.st-code:focus-visible { outline: 2px solid var(--st-focus); outline-offset: 1px;
                          border-radius: var(--st-radius-xs); }

/* ==========================================================================
   Links inside semantic surfaces

   Third occurrence of one bug, so it gets a rule rather than a third patch.

   An unstyled <a> takes `--st-link-primary` (as of the rule above, which is
   what made this sentence true). Inside a surface that already
   carries its own semantic colour that is wrong in a way that is worse than
   ugly: on a green-primary brand, a link inside a BLOCKED status renders in the
   action hue, so a failure reads as an action. That is the role collision the
   token-level fix removed, reappearing at composition level.

   The rule: inside any surface whose colour already means something, a link
   inherits that colour and carries an underline instead. The underline is what
   makes it still read as a link once the colour is spent.

   Reported from the field on `.st-statusband`, and generalised here because the
   same defect was latent in every other surface on this list. `.st-note` and
   `.st-toast` had it and nobody had put a link in one yet.
   ========================================================================== */
.st-statusband a,
.st-note a,
.st-toast a,
.st-empty a,
.st-step__text a,
.st-tag a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.st-statusband a:hover,
.st-note a:hover,
.st-toast a:hover,
.st-empty a:hover { text-decoration-thickness: 2px; }

/* ==========================================================================
   Content link
   [encode 2026-08-20, ledger E-19] Added. The system styled links inside
   semantic surfaces and links inside components, but a bare content link had
   no class — so it took the UA default, which fails contrast in dark theme
   (found by axe on the acceptance render, the audit working as designed).
   ========================================================================== */
.st-link { color: var(--st-link-primary); font-weight: 600; text-decoration: none; }
.st-link:hover { color: var(--st-link-hover); text-decoration: underline; text-underline-offset: 2px; }
.st-link:focus-visible { outline: 2px solid var(--st-focus); outline-offset: 1px; border-radius: var(--st-radius-xs); }

/* ==========================================================================
   Key code — a machine-readable string a person must read aloud or transcribe

   Added. Pairing codes, one-time passcodes, short reference IDs. The requirement
   is not decorative: it must survive being read down a phone line, so the glyphs
   have to be unambiguous and the grouping has to be visible.
   ========================================================================== */
.st-keycode { font: var(--st-type-display-weight) var(--st-type-display-size)/1.1 var(--st-font-mono);
              letter-spacing: 0.12em; font-variant-numeric: tabular-nums slashed-zero;
              color: var(--st-text-primary); display: inline-block; }
.st-keycode--sm { font-size: var(--st-type-heading-md-size); }

/* ==========================================================================
   Code block — machine text, as a block

   Added 6 Sep 2026, adopted from an engagement proposal (CP-04). Carbon has no
   equivalent; this is Strata's own.

   The system had `.st-code`, and it is an INLINE type utility: a font, a size, a
   letter-spacing, nothing else. It is right for an identifier in a sentence or in a
   cell. It is wrong for a formula on its own line or a payload of several, because a
   block of machine text needs a SURFACE, a gutter and a scroll of its own before it is
   readable -- and without them every product that shows one reaches for an inline
   style, which is exactly what happened.

   Measured on the engagement that raised it: a six-line agent payload rendered as a
   bare <pre> with an inline white-space rule was the least readable thing in the
   artefact, and the reason was that it looked like prose in a monospace font.

   A long line scrolls INSIDE the block and never on the page. That is the same rule
   `.st-table-wrap` now follows, and for the same reason: a container that cannot hold
   its content says so rather than breaking the page around it.
   ========================================================================== */
.st-codeblock {
  display: block; margin: 0;
  padding: var(--st-space-04) var(--st-space-05);
  background: var(--st-layer-accent-01);
  border: 1px solid var(--st-border-subtle-01);
  border-radius: var(--st-radius-md);
  font: var(--st-type-code-weight) var(--st-type-code-size)/1.6 var(--st-font-mono);
  letter-spacing: var(--st-type-code-ls);
  color: var(--st-text-primary);
  overflow-x: auto;
  white-space: pre;
  tab-size: 2;
}
/* A caption, because machine text with no label is a puzzle: the reader has to work out
   what they are looking at before they can start reading it. */
.st-codeblock__head {
  display: flex; align-items: baseline; gap: var(--st-space-03);
  margin-bottom: var(--st-space-02);
  font: var(--st-type-label-weight) var(--st-type-label-size)/var(--st-type-label-lh) var(--st-font-sans);
  letter-spacing: var(--st-type-label-ls); text-transform: uppercase;
  color: var(--st-text-helper);
}
.st-codeblock__meta { margin-inline-start: auto; text-transform: none; letter-spacing: 0;
                      font-weight: 400; font-variant-numeric: tabular-nums; }
/* Keys inside a payload: ONE weight of separation and no colour. The proposal arrived
   setting a colour here and its own comment argued against doing so -- a syntax palette
   inside a product that also uses colour for meaning is two vocabularies fighting over
   the same channel. Corrected at adoption; weight carries it, and it introduces no
   contrast pair the audit would have to learn. */
.st-codeblock b { font-weight: 600; }
/* One line on its own -- a formula in a field. Same surface, less furniture, and it
   wraps rather than scrolls because a single expression has nowhere to scroll to. */
.st-codeblock--line { padding: var(--st-space-03) var(--st-space-04); white-space: pre-wrap;
                      overflow-wrap: anywhere; }

/* ==========================================================================
   SUBJECT STATE — app.subject-state

   The tenth region, added after a field engagement demonstrated that the nine
   did not cover it. Its three regions -- how stale the extracted copy is,

/* Appearance comes from `.st-review` and `.st-review--bar`. These rules place
   them, which is the only part the system has no opinion about. */
#rbar { position: fixed; top: 0; left: 0; right: 0; z-index: 300;
        height: 36px; padding-block: 0;
        display: flex; align-items: center; gap: var(--st-space-04); }
#rbar .rsp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; color: var(--st-text-secondary); }
body { padding-top: 36px; }
:root { --st-shell-offset: 36px; }

/* Region outlines. Painted only when toggled, never on the canvas. */
body.rgn [data-region] { outline: 1px dashed var(--st-indigo-40); outline-offset: 2px; cursor: help; }
body.rgn [data-region]:hover { outline-color: var(--st-indigo-70); outline-style: solid; }
#rpop { position: fixed; z-index: 320; max-width: 340px; }
#rdrawer { position: fixed; top: 36px; right: 0; bottom: 0; width: min(440px, 92vw);
           z-index: 310; overflow-y: auto; padding: var(--st-space-06);
           background: var(--st-layer-01);
           border-left: 1px solid var(--st-border-strong-01); }
@media print { [data-review] { display: none !important; } body { padding-top: 0; } }

/* ---- 2 · a block that is deliberately NOT the design system ------------- */
/* Ruled 23 August: the agent's interaction cannot be modelled in UX, because it
   is determined by the system reading the store. So the conversation inside the
   agent panel is an IDEA, not a design, and it must not look like one.

   This class exists to FAIL the eye test on purpose. A polished render of an
   undecided interaction is the most expensive drawing there is: somebody builds
   it, because it looked decided.

   Hand-drawn edge, no brand colour, no system radius, monospaced labels. It uses
   only greyscale tokens, so it stays legible in both themes without ever claiming
   a brand. Named `sk-` rather than `st-` because it is NOT a Strata component and
   must never be mistaken for a proposal to become one. */
.sk-sketch { position: relative;
             padding: var(--st-space-06) var(--st-space-05) var(--st-space-05);
             border: 2px dashed var(--st-border-strong-01);
             border-radius: 2px;                 /* deliberately not a system radius */
             background: repeating-linear-gradient(135deg, transparent, transparent 9px,
               var(--st-layer-accent-01) 9px, var(--st-layer-accent-01) 10px); }
.sk-label { position: absolute; top: -0.7em; left: var(--st-space-05);
            padding-inline: var(--st-space-03); background: var(--st-layer-01);
            font: 400 var(--st-type-helper-size)/1 var(--st-font-mono);
            letter-spacing: .08em; text-transform: uppercase; color: var(--st-text-helper); }
.sk-body { display: flex; flex-direction: column; gap: var(--st-space-04); }
/* One turn. A box and a speaker, and nothing else — no avatars, no timestamps, no
   status ticks, because every one of those is a decision nobody has made. */
.sk-turn { border: 1.5px solid var(--st-border-strong-01); border-radius: 2px;
           background: var(--st-layer-01); padding: var(--st-space-04); }
.sk-turn--you  { margin-inline-start: var(--st-space-07); }
.sk-turn--them { margin-inline-end: var(--st-space-07); }
.sk-who { display: block; margin-bottom: var(--st-space-02);
          font: 400 var(--st-type-helper-size)/1 var(--st-font-mono);
          text-transform: uppercase; letter-spacing: .08em; color: var(--st-text-helper); }
.sk-text { margin: 0; font-size: var(--st-type-body-sm-size);
           line-height: var(--st-type-body-sm-lh); color: var(--st-text-primary); }
/* A claim's mark. In the real thing this is a link into the model with a provenance
   tag; here it is underlined and nothing more, because the expression is the
   product's and the SHAPE is what this sketch is showing. */
.sk-mark { border-bottom: 1.5px solid var(--st-border-strong-01); }
/* The box you type in. A rectangle. That is the entire claim being made. */
.sk-composer { border: 1.5px solid var(--st-border-strong-01); border-radius: 2px;
               background: var(--st-layer-01); padding: var(--st-space-04);
               min-height: calc(var(--st-space-07) * 1.5);
               color: var(--st-text-helper); font-size: var(--st-type-body-sm-size); }
.sk-note { font: 400 var(--st-type-helper-size)/1.5 var(--st-font-mono);
           color: var(--st-text-helper); padding-inline-start: var(--st-space-04);
           border-inline-start: 2px solid var(--st-border-subtle-01); }

/* ============================================================
   Every state of every flow, from the register — not a painted
   appendix: each one is the real region rendering differently,
   reachable from the review drawer.

   Condition 3 of the Bound gate says every state, with loading and
   empty DESIGNED rather than defaulted. Designed means somebody
   decided what the absence says. "No results" is a default;
   "nothing changed, and 247 things elsewhere still have no
   description" is a decision.
   ============================================================ */
const ST = {};                        /* region -> [ [label, render], ... ] */
const stIx = r => (S.st && S.st[r]) || 0;
const stateOf = (r, ...args) => { const set = ST[r]; if (!set) return null;
  const [, fn] = set[Math.min(stIx(r), set.length - 1)]; return fn(...args); };

/* The queue's state 0 IS its ordinary case, so those regions can render straight
   from the register. The workbench's cannot: the register lists a line item's
   states starting at "undocumented", and an agreed row rendered from state 0
   would contradict its own trust strip — the screen would say agreed at the top
   and "nothing has been written about this yet" underneath. So these regions
   render from the DATA by default, and from the register only when a state has
   actually been selected. The register drives the state browser; it does not
   overwrite the record. */
const stateIf = (r, fallback, ...args) =>
  (S.st && Object.prototype.hasOwnProperty.call(S.st, r)) ? stateOf(r, ...args) : fallback;

/* ============================================================
   F-5, ruled 23 August: OPTION B. The agent is not a section of
   the product — it is a way of asking about whatever is already
   in front of you. So there is no sixth item in the top bar.
   There is one control, always in the same place, and it names
   its own scope before you open it.

   Why the scope is IN the label rather than inside the panel:
   the one thing that can go wrong here is asking a question and
   getting an answer about something else. A control that reads
   "Ask about SAL03 Salary Cost LC" cannot make that mistake
   silently. A control that reads "Ask" can.
   ============================================================ */
function askScope() {
  /* Not on the reference sheet: that page IS the agent, described. Offering
     "ask about this" there is a control that loops back to the thing you are
     already reading. */
  if (S.route === 'chat')
    return {ok:false, label:'Ask', full:'You are already looking at it',
            why:'This page describes the exchange itself.'};
  if (S.route === 'registry' || S.route === 'onboard' || S.route === 'signin')
    return {ok:false, label:'Ask', full:'Choose a model first',
            why:'An answer is grounded in one model that has been read. Nothing here is answered across a tenant, so there is nothing to ask about yet.'};
  if (S.route === 'settings')
    return {ok:false, label:'Ask', full:'Settings is not part of a model',
            why:'These are configuration values, not model content. The agent answers from what was read out of Anaplan.'};
  const m = MODELS.find(x => x[0] === S.model) || MODELS[0];
  if (S.route === 'workbench' && S.anchor) {
    const mod = MODULES.find(x => x[0] === S.anchor);
    const li = S.item != null && LINEITEMS[S.anchor] ? LINEITEMS[S.anchor][S.item] : null;
    if (li)  return {ok:true, label:li[0],  full:li[0],  kind:'line item', model:m[1]};
    if (mod) return {ok:true, label:mod[0], full:mod[1], kind:'module',    model:m[1]};
  }
  if (S.route === 'queue') {
    const c = CATS.find(x => x[0] === S.cat) || CATS[0];
    return {ok:true, label:c[1], full:c[1], kind:'what is waiting', model:m[1]};
  }
  return {ok:true, label:m[0], full:m[1], kind:'model', model:m[1]};
}

function askButton() {
  const sc = askScope();
  /* No model in scope, no control. The status band follows exactly this rule and
     disappears on exactly these routes, so the two agree: when there is nothing
     the product is scoped TO, neither the scope nor the way to ask about it is
     shown. A disabled button here would be a control whose only function is to
     explain why it does nothing.

     The header's capacity is the reason the label is hidden rather than dropped
     below 1280: measured at 1024 it already carries a brand, five sections, an
     environment tag, a waiting count, an auth dot and an account. What is given
     up is seeing the scope BEFORE pressing; a broken frame is the dearer loss.
     `.st-visually-hidden` is the system's utility for a name that is read and not
     drawn — the previous revision restated the technique inline in a media query,
     which is the drift the system's own comment at that rule warns about. */
  if (!sc.ok) return '';
  const wide = window.innerWidth >= 1280;
  return `<button class="st-shell__utilbtn st-nowrap"
    data-t="ask" aria-expanded="${!!S.ask}" aria-haspopup="dialog"
    style="display:inline-flex;align-items:center;width:auto;padding-inline:var(--st-space-03);gap:var(--st-space-02)"
    aria-label="Ask about ${E(sc.full)}">
    <span aria-hidden="true">&#9737;</span>
    <span class="${wide ? '' : 'st-visually-hidden'}" aria-hidden="true">Ask about
     <span class="st-truncate" style="display:inline-block;max-width:18ch;vertical-align:bottom">${E(sc.label)}</span></span></button>`;
}

/* app.subject-state — the model in scope AND the state that is about it.
   A band that says "read three days ago" without naming what it read is
   state floating free of its subject. Decided 23 Aug. */
function band() {
  const m = MODELS.find(x => x[0] === S.model) || MODELS[0];
  const scoped = SECOF[S.route] !== 'registry' && SECOF[S.route] !== 'settings';
  if (!scoped) return '';
  const item = (region) => {
    const [cls, text] = stateOf(region) || ['', ''];
    return `<span class="st-statusband__item ${cls}" data-region="${region}">
      <span class="st-statusband__dot" aria-hidden="true"></span>${text}</span>`;
  };
  return `<div class="st-statusband" id="band" data-region="app.subject-state" role="status">
    <span class="st-statusband__item"><b>${E(m[1])}</b>
      <a href="#registry" data-go="registry">change</a></span>
    ${item('chrome.currency-band')}
    ${item('chrome.writes-blocked')}
    ${item('chrome.verification-alert')}
  </div>`;
}

/* app.secondary-nav — renders only inside a section with depth, and holds
   ONE kind of thing per section: structure in Explore, categories in Needs you. */
function rail() {
  const kind = RAILS[S.route] || (S.route === 'workbench' || S.route === 'contents' ? 'structure' : null);
  if (!kind) return '';
  const body = kind === 'categories' ? railCategories() : railStructure();

}

function railSearch(ph, code) {
  /* The search IS a region with five recorded states, so it renders from the
     register like every other one rather than being a fixed input that happens
     to sit in the rail. */
  const st = code ? stateIf(code, null) : null;
  return `<div class="st-rail__group"${code ? ` data-region="${code}"` : ''}
    style="padding-inline:var(--st-space-05)">${st || `<div class="st-search">
    <label class="st-search__field"><span class="st-search__icon" aria-hidden="true">&#9906;</span>
    <input class="st-field" type="search" placeholder="${E(ph)}" aria-label="${E(ph)}"></label></div>`}</div>`;
}

/* Every group: a header with a count, an optional filter inside that group,
   a flat list of items. A chevron marks an item that can be stepped into. */
function railGroup(label, count, items, filter) {
  return `<div class="st-rail__group">
    <div class="st-rail__label">${E(label)} <span class="st-rail__count">${E(count)}</span></div>
    ${filter || ''}
    ${items}
  </div>`;
}

function railStructure() {
  if (S.anchor) {   // re-rooted into a module: the way back states the filter still in force
    const mod = MODULES.find(m => m[0] === S.anchor);
    const lis = (LINEITEMS[S.anchor] || []).map((li, i) =>
      `<a class="st-rail__link" href="#workbench" data-go="workbench" data-li="${i}"${S.item === i ? ' aria-current="page"' : ''}>${E(li[0])}
        <span class="st-rail__meta st-nowrap">${E(li[1])}</span></a>`).join('');
    return railSearch('Find anything', 'workbench.anchor-search')
      + `<div class="st-rail__group"><a class="st-rail__link" href="#model-home" data-go="model-home" data-unroot="1">
          &larr; Modules${S.areaFilter ? ' &middot; ' + E(S.areaFilter) : ''}
          <span class="st-rail__meta st-nowrap">${S.areaFilter ? MODULES.filter(m => m[2] === S.areaFilter).length : 312}</span></a></div>`
      + railGroup(mod ? mod[1] : '', 38, lis + '<a class="st-rail__link" href="#contents" data-go="contents">33 more&hellip;</a>');
  }
  const shown = S.areaFilter ? MODULES.filter(m => m[2] === S.areaFilter) : MODULES;
  const mods = shown.slice(0, 3).map(m =>
    `<a class="st-rail__link" href="#workbench" data-go="workbench" data-mod="${m[0]}">
      <span class="st-truncate">${E(m[1])}</span>
      <span class="st-rail__meta st-nowrap">${m[3]} &rsaquo;</span></a>`).join('')
    + (shown.length > 3 ? `<a class="st-rail__link" href="#contents" data-go="contents">${
        S.areaFilter ? shown.length - 3 : 309} more&hellip;</a>` : '');

  /* Business areas are gone from the rail. They were a fourth way to reach a
     module — the search reaches one, the Modules group reaches one, All contents
     reaches one — and an area is not a thing you work ON, it is a way of
     describing where a module sits. It survives as a COLUMN in All contents and
     as the set-state below, which is where a grouping belongs. What stays here is
     the SET state, because a filter you cannot see is a filter you cannot trust. */
  const filter = S.areaFilter ? `<a class="st-rail__link" href="#model-home" data-clearfilter="1"
      aria-current="true" aria-label="Clear the ${E(S.areaFilter)} filter">${E(S.areaFilter)}
      <span class="st-rail__meta st-nowrap">&times;</span></a>` : '';

  /* One shape for every kind: three real rows, each carrying the fact that
     decides whether you open it, then the way to all of them. A group header
     with a count and nothing under it says the product has not been finished.
     The name truncates and the meta never does. At 256px one of the two has to
     give, and the meta is the part that decides whether you open the row —
     "68,402 members" is the reason to think twice; a shortened name is still
     recognisable. */
  const kind = (rows, total, seen) => rows.map(r =>
      `<a class="st-rail__link" href="#contents" data-go="contents">
        <span class="st-truncate">${E(r[0])}</span>
        <span class="st-rail__meta st-nowrap">${E(r[1])}</span></a>`).join('')
    + `<a class="st-rail__link" href="#contents" data-go="contents">${N(total - seen)} more&hellip;</a>`;

  return railSearch('Find anything', 'workbench.anchor-search')
    + railGroup('Modules', S.areaFilter ? shown.length : 312, mods, filter)
    + railGroup('Lists', 41, kind(LISTS, 41, LISTS.length))
    + railGroup('Views', 184, kind(VIEWS, 184, VIEWS.length))
    + railGroup('Actions', 62, kind(ACTIONS, 62, ACTIONS.length));
}

/* The counted chooser. Every category and its count, always, with the total
   above them — the condition the whole composition rests on. */
function railCategories() {
  const items = CATS.map(c =>
    `<a class="st-rail__link" href="#queue" data-go="queue" data-cat="${c[0]}"${S.cat === c[0] ? ' aria-current="page"' : ''}>${E(c[1])}
      <span class="st-rail__meta st-nowrap">${N(c[2])}</span></a>`).join('');
  return railSearch('Filter these 755')
    + railGroup('Needs you', N(755), items)
    + `<div class="st-rail__group"><div class="st-rail__label">Last run</div>
        <div class="st-helper" style="padding-inline:var(--st-space-05)">2 Aug, 04:10 &middot; 11 minutes &middot; no errors</div></div>`;
}

/* skeletons — the production-grade form of "not decided" */
function skelTable(rows, job) {
  return `<div class="st-skeleton-table"><div class="st-skeleton-table__head"></div>
    ${Array.from({length:rows}, () => `<div class="st-skeleton-table__row">
      <div class="st-skeleton st-skeleton--text" style="max-width:22%"></div>
      <div class="st-skeleton st-skeleton--text"></div>
      <div class="st-skeleton st-skeleton--text" style="max-width:14%"></div></div>`).join('')}
   </div>
   <p class="st-skeleton__job"><b>Open</b> ${E(job)}</p>`;
}
function skelBlock(job, h) {
  return `<div class="st-skeleton st-skeleton--block" style="min-height:${h || 96}px"></div>
   <p class="st-skeleton__job"><b>Open</b> ${E(job)}</p>`;
}

/* A loading state is designed, not defaulted: skeletons shaped like what is
   coming, so nothing jumps when it lands, and a sentence saying what is being
   waited for. A spinner would say "something is happening" and nothing else. */
function loadingFor(route) {
  const shape = {
    queue:       ['Judgement questions', 'Reading what the run raised', 'table'],
    workbench:   ['SAL03 Salary Cost', 'Reading this module from the store', 'table'],
    'model-home':['Workforce planning for Meridian Retail', 'Recomputing coverage after your edit', 'stats'],
    registry:    ['Your models', 'Reading each store', 'table'],
    contents:    ['Everything in this model', 'Reading 312 modules', 'table'],
    activity:    ['History of changes', 'Reading the trail', 'table'],
  }[route] || ['', 'Reading', 'block'];
  const body = shape[2] === 'stats'
    ? `<div class="st-grid">${[0,1,2].map(() => `<div class="st-col st-col--third">
        <div class="st-tile"><div class="st-tile__body"><div class="st-skeleton-stat">
         <div class="st-skeleton st-skeleton--fig"></div>
         <div class="st-skeleton st-skeleton--text"></div></div></div></div></div>`).join('')}</div>`
    : shape[2] === 'table' ? skelTable(5, shape[1]) : skelBlock(shape[1], 140);
  return `<div class="st-container"><div class="st-page">
    <div class="st-page__head"><div><h1 class="st-display st-page__title">${E(shape[0])}</h1>
      <p class="st-body-md st-page__sub">${E(shape[1])}&hellip;</p></div></div>
    <div class="st-stack" style="--gap:var(--st-space-08)" aria-busy="true">${body}</div>
   </div></div>`;
}

/* ============================================================
   The reveal pane — now `app.detail`, the system's own region.

   The previous revision built this by hand in ~40 lines of local CSS, under a
   comment reading "the shell has ten regions and none is a right-hand pane, so
   the frame the client confirmed cannot be built from system parts". That was
   true when it was written and Strata closed it on 23 August as E-26, which is
   the ledger entry this artefact's own proposal CP-01 produced.

   Two things fall out of using the real one, and the second is the interesting one.

   The layout bug goes. The hand-built pane sat INSIDE `.st-shell__main`, so it
   could not join the shell's grid, and making it full-height meant turning main
   into a flex column — at which point `.st-container`'s `margin-inline: auto`
   suppressed stretch and every screen's left reading edge landed wherever its
   widest element put it, measured at x=0, 127, 251, 293, 415 and 419 across
   eleven routes. The system panel is a grid SIBLING of main, so none of that
   arises. The `.st-shell__main` overrides and the `P4b` correction are both gone.

   The resize grip goes, deliberately. It was the one part of the workaround the
   system does not carry, and it was declined rather than adopted: drag-resize
   needs persistence, a keyboard path and an aria-valuenow contract, which makes
   it a component rather than a modifier, on a single occurrence. What this
   product actually needed was a wider default, and the system already exposes
   that as `--st-shell-panel` — set once on the shell, below.

   The overlay breakpoint moves from 1440 to the system's 1056, and that is now
   correct rather than a concession. The old reason for overlaying earlier was
   "losing a column is worse than covering the list", which only held while
   `.st-table-wrap` clipped a wide table away. It scrolls now.
   ============================================================ */
let PANE = null;
function withPane(main, pane) { PANE = pane || null; return main; }

function panel(title, sub, body, region) {
  return R(region || 'app.detail', `<aside class="st-shell__panel" data-open="true"
      aria-label="${E(title)}">
    <div class="st-panel__head">
      <h2 class="st-panel__title">${E(title)}${sub ? `<span class="st-helper" style="display:block;font-weight:400">${sub}</span>` : ''}</h2>
      <button class="st-panel__dismiss" data-closepane aria-label="Close the panel">&times;</button>
    </div>
    <div class="st-panel__body"><div class="st-stack" style="--gap:var(--st-space-06)">${body}</div></div>
  </aside>`);
}

/* ============================================================
   The screens. Region placement follows COMPOSITION-INTENT.md:
   the anchor is most prominent, the reading order is document order.
   ============================================================ */
const V = {};

/* The system's own answer for a form-heavy or prose page: `.st-container--narrow`
   at 45rem. Settings and sign-in are columns of fields, and a field stretched to
   1,408px is a worse control than the same field at 720 — the label and its value
   stop being one object. Declared per screen rather than set inline, which is
   what four screens were doing before the system carried the class. */
const NARROW = new Set(['settings', 'signin']);
const page = (title, sub, body, crumbs) => `<div class="st-container${NARROW.has(S.route) ? ' st-container--narrow' : ''}"><div class="st-page">
  ${crumbs || ''}
  <div class="st-page__head"><div>
    <h1 class="st-display st-page__title">${title}</h1>
    ${sub ? `<p class="st-body-md st-page__sub">${sub}</p>` : ''}
  </div></div><div class="st-stack" style="--gap:var(--st-space-08)">${body}</div></div></div>`;

const crumb = parts => `<nav class="st-crumb" aria-label="Breadcrumb"><ol style="display:contents">${
  parts.map((p, i) => `<li>${i === parts.length - 1
    ? `<span aria-current="page">${E(p[0])}</span>`
    : `<a href="#${p[1]}" data-go="${p[1]}"${p[2] ? ` data-mod="${p[2]}"` : ''}>${E(p[0])}</a>`}</li>`).join('')}</ol></nav>`;

const tag = (t) => {
  const m = {agreed:'st-tag--green', 'machine draft':'st-tag--blue',
             undocumented:'st-tag--amber', applied:'st-tag--teal'};
  return `<span class="st-tag st-tag--sm ${m[t] || ''}">${E(t)}</span>`;
};

/* One group: a heading, the thing, and the sentence about the thing. The gap
   inside it is one visible step smaller than the gap between groups — otherwise
   the layout says everything is one group and the eye files the screen as noise. */
function grp(...parts) {
  return `<div class="st-stack" style="--gap:var(--st-space-05)">${parts.filter(Boolean).join('')}</div>`;
}

function sortHead(label, sorted) {
  return `<th scope="col"${sorted ? ` aria-sort="${sorted}"` : ''}><button class="st-table__sort st-nowrap" type="button">${E(label)}
    <svg class="st-table__sortarrow" viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M6 2l4 6H2z"/></svg></button></th>`;
}

function statTile(fig, label, meter) {
  return `<div class="st-stat"><div class="st-stat__figure">${E(fig)}</div>
   <div class="st-stat__label">${E(label)}</div>

}

/* page + pane, so every screen composes the same way */

  const pane = S.route === 'registry' ? modelPane() : areaPane();
  return page(title, sub, withPane(body, pane), crumbs);
}
function modelPane() {

      <dt>Described</dt><dd class="st-num">${m[4] == null ? '—' : m[4] + '%'}</dd>
      <dt>Last read</dt><dd>${m[5] || 'never'}</dd>
      <dt>Steward</dt><dd>james.t</dd></dl>
     ${m[6] ? `<div class="st-note st-note--warning"><div>
       Anaplan has changed since this was read. A refresh is what turns those changes into
       things you can answer.</div></div>` : ''}
     <div class="st-btn-group">
      <button class="st-btn st-btn--primary st-btn--sm" data-go="model-home" data-model="${m[0]}">Open this model</button>
      <button class="st-btn st-btn--tertiary st-btn--sm">Refresh it</button></div>
     <div class="st-helper">Opening a model changes what every other section is scoped to, so it is a

}
function areaPane() {

     <div class="st-helper">Setting the filter is an offer, not an automatic act &mdash; reading about an
      area and narrowing the sidebar to it are two different intentions.</div>`,

/* ---------- Models · anchor: registry.model-cards ----------

function modelCards(k) {

      <td class="st-nowrap">${E(m[1])}</td>

      <td class="st-nowrap"><span class="st-text-secondary">never opened</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="st-helper"><b>Sorted by name, because nothing has been opened yet.</b> These are

      ${sortHead('State')}</tr></thead>
    <tbody>${MODELS.slice(0,2).map(m => `<tr class="st-table__rowlink">
      <td class="st-nowrap"><a class="st-code" href="#model-home" data-go="model-home">${E(m[0])}</a></td>
      <td class="st-nowrap">${E(m[1])}</td>
      <td class="st-num"><b>${N(m[3] || 0)}</b></td>
      <td><span class="st-tag st-tag--sm st-tag--green">current</span></td></tr>`).join('')}
    </tbody></table></div>
    <div class="st-helper"><b>Two models, and two rows.</b> This normally shows the twenty most-used
     &mdash; where fewer exist it shows what exists, and does not pad the list to look busier.</div>`;
  if (k === 3) return `<div class="st-table-wrap"><table class="st-table">
    <thead><tr>${sortHead('Code','ascending')}${sortHead('Model')}
      <th scope="col" class="st-num"><button class="st-table__sort st-nowrap" type="button">Waiting</button></th>
      ${sortHead('State')}</tr></thead>
    <tbody>${MODELS.slice(0,2).map(m => `<tr class="st-table__rowlink">
      <td class="st-nowrap"><a class="st-code" href="#model-home" data-go="model-home">${E(m[0])}</a></td>
      <td class="st-nowrap">${E(m[1])}</td>
      <td class="st-num"><b>${N(m[3] || 0)}</b></td>
      <td><span class="st-tag st-tag--sm st-tag--green">current</span></td></tr>`).join('')}
     <tr class="st-table__rowlink"><td class="st-nowrap"><a class="st-code" href="#onboard" data-go="onboard">SUP</a></td>
      <td class="st-nowrap">SUP Supply Chain</td>
      <td class="st-num"><span class="st-text-secondary">&mdash;</span></td>
      <td><span class="st-tag st-tag--sm st-tag--red">store did not build</span></td></tr>

  return `<div class="st-table-wrap"><table class="st-table">
    <thead><tr>${sortHead('Code','ascending')}${sortHead('Model')}
      <th scope="col" class="st-num"><button class="st-table__sort st-nowrap" type="button">Waiting</button></th>
      <th scope="col" class="st-num"><button class="st-table__sort st-nowrap" type="button">Described</button></th>

     system paints.</b> The previous revision added a small "open" chip beside the code, under a note saying

     : k === 2
     ? `<div class="st-helper">Filtered to <b>WFP</b>. The count says 2 of 412 rather than 2 of 6,
        because what was narrowed is the whole set, not the page.</div>`
     : `<div class="st-helper">Grouping by client is a column, not a heading &mdash; with one client a
        heading of one is noise, and the column simply carries the same name every row.</div>`);
}

function seeAll(k) {
  if (k === 1) return `<div class="st-helper"><b>These four are every model in this client</b>, so there
    is nothing behind a "see all". The disclosure appears when the cards are a subset.</div>`;
  return `<details class="st-disclose"><summary>
     <svg class="st-disclose__chev" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M6 3l5 5-5 5z"/></svg>
     <span class="st-disclose__title">Every model in this client</span>
     <span class="st-disclose__meta">128</span></summary>
    <div class="st-disclose__body">${R('registry.tenant-table',
      stateIf('registry.tenant-table', tenantTable(0)))}</div></details>`;
}

function archive(k) {
  if (k === 1) return `<div class="st-note st-note--warning"><div><b>Archive WFP Sandbox?</b>
    It stays readable and every answer that cited it still resolves. What changes is that it leaves
    this list.
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--secondary st-btn--sm">Archive it</button>
     <button class="st-btn st-btn--tertiary st-btn--sm">Cancel</button></div>
    <div class="st-helper" style="margin-top:var(--st-space-03)"><b>There is no delete.</b> A store
     that has been cited by answers cannot be removed without making those answers unverifiable.</div>
    </div></div>`;
  if (k === 2) return `<div class="st-note"><div><b>WFP Sandbox is archived &mdash; visible, not
    deleted.</b> It is out of the list above and still reachable from All contents and from any
    answer that cited it.
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--tertiary st-btn--sm">Bring it back</button></div></div></div>`;
  return `<div class="st-helper">A model you no longer work on can be archived &mdash; it stays
    visible and readable, it is not deleted. <b>No requirement covers this and no architecture
    decision names it.</b> Either a requirement is missing or this part is; flagged, not removed.</div>`;
}

function divergence(k) {
  if (k === 0) return `<div class="st-helper">Hidden unless a second local copy of a store is found.</div>`;
  return `<div class="st-note st-note--error"><div>
    <b>Two local copies claim to be SUP Supply Chain.</b> One was built here on 4 August;
    the other carries a different store identity and a higher sequence number.
    <b>No merge is offered</b> &mdash; merging two knowledge stores silently would produce a
    third that neither person recognises, and nobody would be able to say which sentence came
    from where.
    <div class="st-btn-group" style="margin-top:var(--st-space-03)">
     <button class="st-btn st-btn--secondary st-btn--sm">Compare the two</button>
     <button class="st-btn st-btn--tertiary st-btn--sm">Keep this one, archive the other</button></div>
    </div></div>`;
}

V.registry = () => pageP('Your models',
  'Sorted by what is waiting. Three of your four models are in Meridian Retail; two other clients are visible but not readable until you switch.',
  R('registry.model-cards',          stateIf('registry.model-cards', modelCards(0)))
  + R('registry.search',             stateIf('registry.search', registrySearch(0)))
  + R('registry.tenant-switcher',    stateIf('registry.tenant-switcher', tenantSwitcher(1)))
  + R('registry.onboard-entry',      stateIf('registry.onboard-entry', onboardEntry(0)))
  + R('registry.see-all',            stateIf('registry.see-all', seeAll(0)))
  + R('registry.archive',            stateIf('registry.archive', archive(0)))
  + R('registry.divergence-warning', stateIf('registry.divergence-warning', divergence(1)))
);

/* ---------- Explore · model home · anchor: honesty-snapshot ----------
   Six regions, 23 states. The screen's question is "can I trust what is in
   here", so almost every state is about a gap: an area nobody finished, a term
   nobody agreed, a coverage figure being recomputed and therefore briefly wrong. */
function honesty(k) {
  if (k === 2) return `<div class="st-tile"><div class="st-tile__body">
    <div class="st-empty"><p class="st-empty__title">Nobody has reviewed this model</p>
     <div class="st-empty__body"><p class="st-body-sm">It was read on 4 August and 1,847 machine
      drafts were produced. <b>Not one has been looked at by a person</b>, so there is no coverage
      figure to show &mdash; a percentage here would be measuring the machine against itself.</p>
     <div class="st-btn-group"><button class="st-btn st-btn--primary st-btn--sm" data-go="queue">Start reviewing</button></div>
     </div></div></div></div>`;
  if (k === 3) return `<div class="st-tile"><div class="st-tile__body">
    <div class="st-grid">
     <div class="st-col st-col--third"><div class="st-stat st-stat--unavailable">
      <div class="st-stat__figure">&mdash;</div>
      <div class="st-stat__label">recomputing coverage</div></div></div>
     <div class="st-col st-col--third">${statTile('1,847','machine drafts nobody has confirmed')}</div>
     <div class="st-col st-col--third">${statTile('247','with no description at all')}</div>
    </div>
    <div class="st-helper"><b>The coverage figure is blank, not stale.</b> An edit two minutes ago
     changed what counts as described, and showing the old number while it recomputes is how a
     figure people trust becomes a figure people check.</div></div></div>`;
  const meter = k === 1 ? 41 : 62;
  return `<div class="st-tile"><div class="st-tile__body">
    <div class="st-grid">
     <div class="st-col st-col--third">${statTile(meter + '%','has a description somebody agreed', meter)}</div>
     <div class="st-col st-col--third">${statTile(k === 1 ? '2,904' : '1,847','machine drafts nobody has confirmed')}</div>
     <div class="st-col st-col--third">${statTile(k === 1 ? '1,102' : '247','with no description at all')}</div>
    </div>
    <div class="st-helper">${k === 1
     ? `<b>Partly reconciled.</b> Anaplan changed on 21 August and 247 elements that were agreed are
        now in doubt &mdash; they are counted as drafts again until somebody looks. <b>The figure
        went down because the model moved, not because anyone undid work.</b>`
     : `Read 3 days ago by james.t. Two business areas were never finished.
        312 modules &middot; 11,847 line items.`}</div></div></div>`;
}

function needsMe(k) {
  if (k === 1) return `<div class="st-note st-note--success"><div><b>Nothing is waiting for you.</b>
    Every question this model raised has been answered, and every machine draft has been confirmed
    or rejected. <b>It will not stay this way</b> &mdash; the next refresh will raise more.</div></div>`;
  if (k === 2) return `<div class="st-note"><div><b>312 things are waiting, and none of them on you.</b>
    They are questions for <b>james.t</b>, the steward of Salary and cost.
    <div class="st-helper" style="margin-top:var(--st-space-03)">You can still open them and read
     them. <b>What you cannot do is answer for somebody else</b>, and the queue says whose they are
     rather than showing you a count you cannot act on.</div></div></div>`;
  return `<div class="st-note"><div><b>755 things are waiting for you.</b>
    247 of them are questions only a person can answer.
    <a href="#queue" data-go="queue">Open Needs you</a></div></div>`;
}

function gapsBlock(k) {
  if (k === 0) return `<div class="st-note st-note--warning"><div><b>Four endpoints were declined.</b>
    Anaplan refused the requests for view definitions and action metadata on this model &mdash;
    a permissions answer, not a failure.
    <div class="st-helper" style="margin-top:var(--st-space-03)">So <b>views and actions are named
     but not explained</b>, and any answer that reaches one says so. The gap is in the store, and
     it is declared everywhere the store is used rather than once, here.</div></div></div>`;
  if (k === 1) return `<div class="st-note st-note--warning"><div>
    <b>One list was read in part.</b> <span class="st-code">Employees</span> has 68,402 members and
    the cap in Settings is 50,000, so 18,402 were not read.
    <div class="st-helper" style="margin-top:var(--st-space-03)"><b>Which 18,402 is not knowable</b>
     &mdash; the read stopped at the cap, it did not sample. Every answer touching that list carries
     the same sentence.</div></div></div>`;
  if (k === 3) return `<div class="st-note st-note--success"><div><b>No gaps.</b> Every endpoint
    answered, no list hit its cap, and all fourteen business areas have a description somebody
    agreed. <b>This is rare and it is worth saying out loud</b> rather than showing nothing.</div></div>`;
  return `<div class="st-note st-note--warning"><div><b>Two areas were never finished reading.</b>
    Capacity and utilisation has no description; Demand planning has a machine draft nobody agreed.
    Answers that touch either will say so rather than answering around it.</div></div>`;
}

function areaList(k) {
  const rows = k === 2
   ? [['<span class="st-text-secondary">No area</span>', 7, '—', true],
      ...AREAS.map(a => [E(a[0]), a[2], a[3], false])]

  return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Business areas</h2><span class="st-helper">${k === 2 ? '14, and 7 modules in none' : '14'}</span></div>
   <div class="st-table-wrap"><table class="st-table"><thead><tr>
     ${sortHead('Business area','ascending')}
     <th scope="col" class="st-num"><button class="st-table__sort st-nowrap" type="button">Modules</button></th>
     ${sortHead('Described')}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr${r[3] ? '' : ' class="st-table__rowlink"'}${S.panel === i && !r[3] ? ' aria-selected="true"' : ''}${r[3] ? '' : ` data-panel="${i}"`}>
      <td class="st-nowrap">${r[3] ? r[0] : `<a href="#model-home" data-panel="${i}">${r[0]}</a>`}</td>
      <td class="st-num">${r[1]}</td>
      <td>${r[2] === '—' ? '<span class="st-text-secondary">not an area</span>'
        : k === 1 && i === 2 ? '<span class="st-tag st-tag--sm st-tag--amber">no description</span>'
        : tag(r[2])}</td></tr>`).join('')}</tbody></table></div>
   ${k === 1 ? `<div class="st-helper"><b>Capacity and utilisation has no description at all.</b> It is
     not marked undocumented and left at that &mdash; 26 modules sit inside it, so every answer that
     reaches one of them inherits the gap.</div>` : ''}
   ${k === 2 ? `<div class="st-helper"><b>Seven modules are in no area, and that is a row rather than a
     footnote.</b> An area is how people navigate this model; a module outside every area is a
     module nobody will find by browsing.</div>` : ''}</div>`;
}

function areaEditor(k) {
  if (k === 0) return `<div class="st-helper"><b>Membership is worked out by a rule.</b> Re-run it to
    see what would move &mdash; the editor opens only when there is a difference to look at.</div>`;
  if (k === 2) return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Which modules sit in which area</h2></div>
   <div class="st-loading"><span class="st-loading__spinner" aria-hidden="true"></span>
    <span class="st-body-sm">Re-running the rule over 312 modules</span></div>
   <div class="st-helper"><b>The rule is deterministic</b> &mdash; same modules, same names, same
    answer. Running it twice cannot produce two different results, which is why running it is safe
    and applying it is the deliberate act.</div></div>`;
  if (k === 4) return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Which modules sit in which area</h2></div>
   <div class="st-note st-note--success"><div><b>Two modules moved.</b>
    <span class="st-code">PEN03</span> to Employee data, <span class="st-code">RPT07</span> to
    Demand planning.
    <div class="st-helper" style="margin-top:var(--st-space-03)">Both moves are rows in the trail
     with the rule that caused them. <b>Nothing about the modules themselves changed</b> &mdash;

    <h2 class="st-heading-sm">Which modules sit in which area</h2>
    <span class="st-helper">${preview ? '2 would move' : '7 modules are in no area'}</span></div>
   ${grp(
    preview
     ? `<div class="st-note st-note--warning"><div><b>This is the difference, before it applies.</b>
        Nothing has moved yet and nothing will until you press Apply.</div></div>`
     : `<div class="st-note"><div>Membership is worked out by a rule, not by hand. Re-running it
        shows you the difference <b>before</b> anything applies &mdash; nothing moves until you say so.</div></div>`,
    `<div class="st-table-wrap"><table class="st-table"><thead><tr>
      <th scope="col" style="width:44px"><span class="st-visually-hidden">Select</span></th>
      <th scope="col">Module</th><th scope="col">Area today</th><th scope="col">The rule says</th></tr></thead>
     <tbody>
      <tr><td><label><input type="checkbox" class="st-check"${preview ? ' checked' : ''} aria-label="Select PEN03"><span class="st-check__box"></span></label></td>
       <td class="st-nowrap"><span class="st-code">PEN03</span></td>
       <td${preview ? ' class="st-cmp-before"' : ''}>Salary and cost</td>
       <td${preview ? ' class="st-cmp-after"' : ''}><span class="st-tag st-tag--sm st-tag--amber">Employee data</span></td></tr>
      <tr><td><label><input type="checkbox" class="st-check"${preview ? ' checked' : ''} aria-label="Select RPT07"><span class="st-check__box"></span></label></td>
       <td class="st-nowrap"><span class="st-code">RPT07</span></td>
       <td${preview ? ' class="st-cmp-before"' : ''}><span class="st-text-secondary">no area</span></td>
       <td${preview ? ' class="st-cmp-after"' : ''}><span class="st-tag st-tag--sm st-tag--amber">Demand planning</span></td></tr>
     </tbody></table></div>`,
    `<div class="st-btn-group"><button class="st-btn st-btn--secondary st-btn--sm">Re-run the rule</button>
      <button class="st-btn st-btn--${preview ? 'primary' : 'tertiary'} st-btn--sm"${preview ? '' : ' disabled'}>Apply 2 changes</button></div>`)}</div>`;
}

function glossary(k) {
  if (k === 1) return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Glossary</h2><span class="st-helper">0 terms</span></div>
   ${grp(`<div class="st-empty"><p class="st-empty__title">No terms yet</p>
    <div class="st-empty__body"><p class="st-body-sm">The glossary is where this client&rsquo;s own
     words live &mdash; what <i>colleague</i> means here, what counts as an <i>uplift</i>. Until it

    </div></div>`)}</div>`;
  if (k === 2) return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Glossary</h2><span class="st-helper">12 terms &middot; 1 being edited</span></div>
   ${grp(`<div class="st-formitem st-formitem--full"><label class="st-lbl" for="gl-t">Colleague</label>
     <textarea class="st-field" id="gl-t" rows="2">Any employee, permanent or fixed-term. Excludes contractors and agency staff.</textarea>
     <div class="st-btn-group"><button class="st-btn st-btn--primary st-btn--sm">Save</button>

    `<div class="st-helper"><b>Editing a term makes it unconfirmed again</b>, exactly like a

  if (k === 3) return `<div class="st-section"><div class="st-section__head">
    <h2 class="st-heading-sm">Glossary</h2><span class="st-helper">12 terms</span></div>

     <i>colleague</i> and you followed it here.
     <div class="st-helper" style="margin-top:var(--st-space-03)">This is the whole reason the
      glossary is a real screen and not a settings page: <b>a word in an answer has to be
      traceable to who defined it</b>, the same as any other claim.</div></div></div>`,
    `<div class="st-table-wrap"><table class="st-table"><thead><tr>
      ${sortHead('Term','ascending')}${sortHead('Means')}${sortHead('Provenance')}</tr></thead>
     <tbody><tr class="st-table__rowlink" aria-selected="true">
      <td class="st-nowrap"><a href="#model-home">Colleague</a>
       <span class="st-tag st-tag--sm st-tag--outline">from the answer</span></td>
